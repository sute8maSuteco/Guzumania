<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スケッチバーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe1; --ink:#16141a; --blue:#2f6bff; --red:#ff3b2f; --yellow:#ffd23f; --mint:#6fc7b3;
  --veil:rgba(244,239,225,.86); --card:#fbf8ef; --text:#16141a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --veil:rgba(30,27,36,.9); --text:#f4efe1; }
}
:root[data-theme="dark"]{ --veil:rgba(30,27,36,.9); --text:#f4efe1; }
html,body{height:100%;margin:0;background:var(--paper);overflow:hidden;overscroll-behavior:none;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;inset:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0}
.ink-text{color:var(--ink);text-shadow:2px 0 var(--paper),-2px 0 var(--paper),0 2px var(--paper),0 -2px var(--paper),2px 2px var(--paper),-2px -2px var(--paper),2px -2px var(--paper),-2px 2px var(--paper)}
#row{display:flex;justify-content:space-between;align-items:flex-start}
#score small{display:block;font-size:12px;font-weight:700}
#score b{font-family:"Yusei Magic",sans-serif;font-size:30px;font-weight:400;line-height:1}
#lives{font-size:26px;letter-spacing:2px;line-height:1;padding-top:14px}
#lives .off{opacity:.28}
#lives .on{color:var(--red)}
#bossbar{display:none;margin:8px auto 0;max-width:420px}
#bossbar .label{font-family:"Yusei Magic",sans-serif;font-size:15px;text-align:center;margin-bottom:3px}
.track{height:16px;border:3px solid var(--ink);background:var(--card);border-radius:10px 7px 11px 6px;overflow:hidden}
.track i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left center}
#msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 112px);text-align:center;
  font-family:"Yusei Magic",sans-serif;font-size:26px;opacity:0;transition:opacity .2s}
#msg.show{opacity:1}
#shake{display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);width:min(320px,80vw);text-align:center}
#shake .label{font-family:"Yusei Magic",sans-serif;font-size:30px;margin-bottom:6px;animation:jolt .12s infinite}
#shake .track i{background:var(--yellow);transform:scaleX(0)}
@keyframes jolt{0%{transform:translate(2px,0) rotate(-2deg)}50%{transform:translate(-2px,1px) rotate(2deg)}100%{transform:translate(1px,-1px) rotate(-1deg)}}
#warn{display:none;position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 10px var(--red);animation:blink .5s steps(2) infinite}
#warn div{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:"Yusei Magic",sans-serif;font-size:56px;color:var(--red);
  text-shadow:3px 3px 0 var(--ink),-3px -3px 0 var(--paper),3px -3px 0 var(--paper),-3px 3px 0 var(--paper)}
#warn p{margin:6px 0 0;font-size:20px;color:var(--ink);text-shadow:2px 2px 0 var(--paper),-2px -2px 0 var(--paper),2px -2px 0 var(--paper),-2px 2px 0 var(--paper)}
@keyframes blink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}

#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--veil);
  padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 20px)}
#screen.hide{display:none}
.panel{max-width:420px;width:100%;text-align:center}
.panel h1{font-family:"Yusei Magic",sans-serif;font-weight:400;font-size:clamp(44px,13vw,68px);line-height:1.02;margin:0 0 6px;
  transform:rotate(-2.5deg);color:var(--text);text-shadow:4px 4px 0 var(--red)}
.panel .sub{font-size:17px;font-weight:700;margin:0 0 22px;color:var(--text)}
.panel ul{list-style:none;padding:0;margin:0 0 26px;text-align:left;display:grid;gap:10px}
.panel li{background:var(--card);border:3px solid var(--ink);border-radius:14px 9px 15px 8px;padding:10px 14px;font-size:15px;font-weight:700;line-height:1.45;color:var(--ink)}
.panel li b{color:var(--red)}
.btn{font-family:"Yusei Magic",sans-serif;font-size:28px;color:var(--ink);background:var(--yellow);border:4px solid var(--ink);
  border-radius:16px 10px 18px 9px;padding:12px 38px;box-shadow:6px 6px 0 var(--ink);cursor:pointer;pointer-events:auto}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--blue);outline-offset:4px}
.big{font-family:"Yusei Magic",sans-serif;font-size:clamp(40px,12vw,60px);margin:0 0 10px;transform:rotate(-2deg);color:var(--text)}
.result{font-size:20px;font-weight:700;margin:0 0 24px;color:var(--text)}
.result b{font-family:"Yusei Magic",sans-serif;font-weight:400;font-size:38px;display:block}
@media (prefers-reduced-motion: reduce){#warn,#shake .label{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="row">
    <div id="score" class="ink-text"><small>スコア</small><b id="scoreV">0</b></div>
    <div id="lives" class="ink-text"></div>
  </div>
  <div id="bossbar">
    <div class="label ink-text">ひとつ目の巨人</div>
    <div class="track"><i id="bossFill"></i></div>
  </div>
</div>
<div id="msg" class="ink-text"></div>
<div id="shake"><div class="label ink-text">振りほどけ！</div><div class="track"><i id="shakeFill"></i></div></div>
<div id="warn"><div>WARNING!<p>とてつもなく大きな何かが来る</p></div></div>

<div id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const PAPER=0xf4efe1, INK=0x16141a;
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

/* ---------- renderer / scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(PAPER);
scene.fog=new THREE.Fog(PAPER,70,300);
const camera=new THREE.PerspectiveCamera(70,1,0.1,800);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.55); sun.position.set(-6,12,9); scene.add(sun);
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize); resize();

/* ---------- ink-illustration helpers ---------- */
const grad=(()=>{const d=new Uint8Array([130,195,255]);const t=new THREE.DataTexture(d,3,1,THREE.LuminanceFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const mat=(c,o={})=>new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:grad},o));
const inkMat=new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide});
function mk(geom,material,x=0,y=0,z=0,t=0.12){
  geom.computeBoundingBox();
  const b=geom.boundingBox,c=new THREE.Vector3(),s=new THREE.Vector3();
  b.getCenter(c); b.getSize(s);
  geom.translate(-c.x,-c.y,-c.z);
  const m=new THREE.Mesh(geom,material);
  m.position.set(x+c.x,y+c.y,z+c.z);
  if(t>0){
    const o=new THREE.Mesh(geom,inkMat);
    o.scale.set(1+2*t/Math.max(s.x,.01),1+2*t/Math.max(s.y,.01),1+2*t/Math.max(s.z,.01));
    m.add(o);
  }
  return m;
}

/* ---------- player jet ---------- */
const jetG=new THREE.Group(); scene.add(jetG);
const jetBody=new THREE.Group(); jetG.add(jetBody);
let flameA,flameB;
(function buildJet(){
  const white=mat(0xfbf8ef), blue=mat(0x2f6bff), glass=mat(0x7fb2ff), dark=mat(0x4a4452);
  jetBody.add(mk(new THREE.BoxGeometry(1.3,1.0,4.2),white,0,0,0,0.1));
  const nose=new THREE.ConeGeometry(0.65,2.2,8); nose.rotateX(-Math.PI/2);
  jetBody.add(mk(nose,white,0,0,-3.15,0.1));
  [1,-1].forEach(sg=>{
    const s=new THREE.Shape(); s.moveTo(0,-1.2); s.lineTo(4.4*sg,1.4); s.lineTo(4.4*sg,2.0); s.lineTo(0,2.0); s.closePath();
    const geo=new THREE.ExtrudeGeometry(s,{depth:0.18,bevelEnabled:false}); geo.rotateX(Math.PI/2);
    jetBody.add(mk(geo,blue,0,-0.1,0,0.1));
    const f=new THREE.Shape(); f.moveTo(-1.8,0); f.lineTo(1.0,0); f.lineTo(-1.4,2.0); f.closePath();
    const fg=new THREE.ExtrudeGeometry(f,{depth:0.15,bevelEnabled:false}); fg.rotateY(Math.PI/2);
    jetBody.add(mk(fg,white,0.75*sg,0.45,0.9,0.08));
  });
  const can=new THREE.SphereGeometry(0.62,12,8); can.scale(1,0.8,1.9);
  jetBody.add(mk(can,glass,0,0.6,-0.7,0.08));
  const nz=new THREE.CylinderGeometry(0.55,0.72,0.7,10); nz.rotateX(Math.PI/2);
  jetBody.add(mk(nz,dark,0,0,2.3,0.08));
  const fo=new THREE.ConeGeometry(0.62,3.8,10); fo.rotateX(Math.PI/2);
  flameA=mk(fo,new THREE.MeshBasicMaterial({color:0xff6a2a}),0,0,2.65,0.1);
  const fi=new THREE.ConeGeometry(0.34,2.4,10); fi.rotateX(Math.PI/2);
  flameB=mk(fi,new THREE.MeshBasicMaterial({color:0xffd23f}),0,0,2.65,0);
  jetBody.add(flameA); jetBody.add(flameB);
})();
const shadow=new THREE.Mesh(new THREE.CircleGeometry(1,20),new THREE.MeshBasicMaterial({color:INK,transparent:true,opacity:.28,depthWrite:false}));
shadow.rotation.x=-Math.PI/2; shadow.scale.set(3.4,2.4,1); scene.add(shadow);

/* ---------- world: ground, scenery, speed lines ---------- */
const groundTex=(()=>{
  const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d');
  x.fillStyle='#efe8d3'; x.fillRect(0,0,512,512);
  x.strokeStyle='#cdc1a1'; x.lineWidth=3; x.lineCap='round';
  for(let i=0;i<=512;i+=128){
    x.beginPath(); x.moveTo(i,0); for(let y=0;y<=512;y+=32) x.lineTo(i+Math.sin(y*.13+i)*2.5,y); x.stroke();
    x.beginPath(); x.moveTo(0,i); for(let xx=0;xx<=512;xx+=32) x.lineTo(xx,i+Math.sin(xx*.11+i)*2.5); x.stroke();
  }
  x.strokeStyle='#d9cfb4'; x.lineWidth=2;
  for(let i=0;i<60;i++){const px=rand(10,500),py=rand(10,490);for(let k=0;k<5;k++){x.beginPath();x.moveTo(px+k*5,py);x.lineTo(px+k*5-10,py+14);x.stroke();}}
  x.strokeStyle='#b5a885'; x.lineWidth=4; x.setLineDash([22,18]);
  x.beginPath(); x.moveTo(256,0); x.lineTo(256,512); x.stroke();
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(10,12); t.anisotropy=4; return t;
})();
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,720),new THREE.MeshBasicMaterial({map:groundTex}));
ground.rotation.x=-Math.PI/2; ground.position.set(0,0,-300); scene.add(ground);

const pastel=[0xf7d9a0,0xbfe3d0,0xf2b8b0,0xc9d6f5,0xfff1b8];
function makeHouse(){
  const g=new THREE.Group(),w=rand(5,9),h=rand(3,6);
  g.add(mk(new THREE.BoxGeometry(w,h,w),mat(pick(pastel)),0,h/2,0,0.2));
  const roof=new THREE.ConeGeometry(w*0.85,h*0.8,4); roof.rotateY(Math.PI/4);
  g.add(mk(roof,mat(0xff6b4a),0,h+h*0.4,0,0.2));
  return g;
}
function makeTree(){
  const g=new THREE.Group(),h=rand(5,9);
  g.add(mk(new THREE.CylinderGeometry(0.5,0.6,2,6),mat(0xb98a5e),0,1,0,0.15));
  g.add(mk(new THREE.ConeGeometry(2.4,h,7),mat(0x7fc79a),0,2+h/2,0,0.2));
  return g;
}
function makeTower(){
  const g=new THREE.Group(),h=rand(10,22),w=rand(4,7);
  g.add(mk(new THREE.BoxGeometry(w,h,w),mat(pick(pastel)),0,h/2,0,0.22));
  g.add(mk(new THREE.BoxGeometry(w*0.4,1.2,w*0.4),mat(0xff6b4a),0,h+0.6,0,0.15));
  return g;
}
function makeCloud(){
  const g=new THREE.Group(),w=mat(0xfdfbf4);
  for(let i=0;i<4;i++){g.add(mk(new THREE.SphereGeometry(rand(3,6),10,8),w,i*4.5-7,rand(-1,2),rand(-2,2),0.22));}
  return g;
}
const scenery=[];
function placeScenery(o,z){
  const m=o.m;
  if(o.type==='cloud'){ m.position.set(pick([-1,1])*rand(32,90),rand(36,70),z); }
  else { m.position.set(pick([-1,1])*rand(20,80),0,z); m.rotation.y=rand(0,6.28); }
}
for(let i=0;i<70;i++){
  const r=Math.random(); let type,m;
  if(r<0.3){type='house';m=makeHouse();}
  else if(r<0.6){type='tree';m=makeTree();}
  else if(r<0.72){type='tower';m=makeTower();}
  else {type='cloud';m=makeCloud();}
  const o={m,type}; placeScenery(o,rand(-340,20)); scene.add(m); scenery.push(o);
}
const lineMat=new THREE.MeshBasicMaterial({color:INK,transparent:true,opacity:.22,fog:false});
const lineGeo=new THREE.BoxGeometry(0.07,0.07,7);
const speedLines=[];
for(let i=0;i<34;i++){
  const m=new THREE.Mesh(lineGeo,lineMat);
  m.position.set(rand(-26,26),rand(1,38),rand(-200,20)); scene.add(m); speedLines.push(m);
}

/* ---------- reticle ---------- */
function makeReticle(r,col){
  const g=new THREE.Group();
  const back=new THREE.Mesh(new THREE.RingGeometry(0.62,1.14,28),new THREE.MeshBasicMaterial({color:INK,depthTest:false,transparent:true,fog:false}));
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.74,1,28),new THREE.MeshBasicMaterial({color:col,depthTest:false,transparent:true,fog:false}));
  back.renderOrder=998; ring.renderOrder=999; ring.position.z=0.01;
  g.add(back); g.add(ring);
  for(let i=0;i<4;i++){
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.6,0.05),new THREE.MeshBasicMaterial({color:col,depthTest:false,transparent:true,fog:false}));
    t.renderOrder=999; const a=i*Math.PI/2; t.position.set(Math.sin(a)*1.45,Math.cos(a)*1.45,0.02); t.rotation.z=-a; g.add(t);
  }
  g.scale.setScalar(r); return g;
}
const retFar=makeReticle(2.7,0xff3b2f), retNear=makeReticle(1.1,0xff3b2f);
scene.add(retFar); scene.add(retNear);

/* ---------- audio ---------- */
let actx=null;
function audioInit(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function tone(f1,f2,dur,type='square',vol=0.04){
  if(!actx)return; const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
}
function noise(dur,vol=0.12){
  if(!actx)return; const n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource(),g=actx.createGain(); s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(actx.destination); s.start();
}
const sfx={
  shoot(){tone(1000,520,0.05,'square',0.014);},
  boom(){noise(0.45,0.14);tone(160,40,0.35,'sawtooth',0.05);},
  small(){noise(0.12,0.06);},
  hit(){tone(320,80,0.2,'sawtooth',0.06);noise(0.2,0.1);},
  clank(){tone(1400,900,0.04,'triangle',0.02);},
  siren(){tone(420,760,0.45,'sawtooth',0.04);},
  grab(){tone(200,60,0.3,'square',0.06);},
  eye(){tone(300,900,0.5,'sine',0.06);}
};

/* ---------- state ---------- */
const G={mode:'title',time:0,stageT:0,score:0,speed:70,speedTarget:70,shake:0,spawnT:1,warnT:0,stageEnd:false,
  grabbed:null,shakeProg:0,holdT:0,msgT:0,overT:0};
const P={nx:0,ny:0,x:0,y:8,hp:5,inv:0,fireT:0,side:1,roll:0};
const input={tx:0,ty:0,keys:{},shake:0};
const enemies=[],pBullets=[],eBullets=[],fx=[];
let boss=null;

/* ---------- HUD ---------- */
const scoreV=$('scoreV'),livesEl=$('lives'),bossbar=$('bossbar'),bossFill=$('bossFill'),shakeBox=$('shake'),shakeFill=$('shakeFill'),warnEl=$('warn'),msgEl=$('msg');
let hudScore=-1,hudLives=-1;
function hudUpdate(){
  if(hudScore!==G.score){hudScore=G.score;scoreV.textContent=G.score;}
  if(hudLives!==P.hp){hudLives=P.hp;let s='';for(let i=0;i<5;i++)s+=i<P.hp?'<span class="on">♥</span>':'<span class="off">♥</span>';livesEl.innerHTML=s;}
}
function showMsg(t,d=1.2){msgEl.textContent=t;msgEl.classList.add('show');G.msgT=d;}

/* ---------- effects ---------- */
const sphGeo=new THREE.SphereGeometry(1,10,8);
const bitA=new THREE.MeshBasicMaterial({color:0xff3b2f,fog:false}), bitB=new THREE.MeshBasicMaterial({color:0xffd23f,fog:false});
function boom(p,size=3,silent=false){
  const g=new THREE.Group(); g.position.copy(p);
  const cm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,fog:false});
  const hm=new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide,transparent:true,fog:false});
  const core=new THREE.Mesh(sphGeo,cm); const hull=new THREE.Mesh(sphGeo,hm); hull.scale.setScalar(1.2); core.add(hull); g.add(core);
  const bits=[];
  for(let i=0;i<8;i++){
    const m=new THREE.Mesh(sphGeo,i%2?bitA:bitB);
    m.userData.v=V3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize().multiplyScalar(size*rand(3,6));
    g.add(m); bits.push(m);
  }
  scene.add(g); fx.push({g,core,bits,cm,hm,t:0,size,life:0.55});
  if(!silent){size>2.5?sfx.boom():sfx.small();}
}
function updateFx(dt){
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i]; f.t+=dt; const k=f.t/f.life;
    if(k>=1){scene.remove(f.g);f.cm.dispose();f.hm.dispose();fx.splice(i,1);continue;}
    f.core.scale.setScalar(f.size*(0.4+k*1.5)); f.cm.opacity=1-k; f.hm.opacity=1-k;
    f.bits.forEach(b=>{b.position.addScaledVector(b.userData.v,dt);b.scale.setScalar(Math.max(.01,f.size*0.3*(1-k)));});
  }
}

/* ---------- enemies ---------- */
const enemyTpl=(function(){
  const g=new THREE.Group(),red=mat(0xff4a3a),cream=mat(0xfbf8ef),dark=mat(0x3a3340);
  const fus=new THREE.CylinderGeometry(0.65,0.55,3.2,10); fus.rotateX(Math.PI/2); g.add(mk(fus,red,0,0,0,0.12));
  const nose=new THREE.ConeGeometry(0.65,1.8,10); nose.rotateX(Math.PI/2); g.add(mk(nose,cream,0,0,2.5,0.12));
  [1,-1].forEach(sg=>{
    const s=new THREE.Shape(); s.moveTo(0,1.0); s.lineTo(3.4*sg,-1.5); s.lineTo(3.4*sg,-2.0); s.lineTo(0,-1.6); s.closePath();
    const geo=new THREE.ExtrudeGeometry(s,{depth:0.16,bevelEnabled:false}); geo.rotateX(Math.PI/2); g.add(mk(geo,cream,0,0,0,0.1));
  });
  g.add(mk(new THREE.BoxGeometry(0.16,1.5,1.2),red,0,0.9,-1.4,0.1));

  });
  group.add(mk(new THREE.BoxGeometry(9,1.6,1.2),dark,0,43.5,9,0.1));
  [-1,1].forEach(sg=>{const f=new THREE.ConeGeometry(0.8,2,6); f.rotateX(Math.PI); group.add(mk(f,white,sg*3,42.2,9.2,0.1));});
  // eye

  eyeG.add(mk(new THREE.SphereGeometry(5.8,18,14),white,0,0,0,0.3));
  const irisMat=mat(0xffb02e,{emissive:0x000000});
  const ic=new THREE.SphereGeometry(5.92,18,8,0,Math.PI*2,0,0.66); ic.rotateX(Math.PI/2); eyeG.add(mk(ic,irisMat,0,0,0,0));
  const pc=new THREE.SphereGeometry(6.0,14,8,0,Math.PI*2,0,0.3); pc.rotateX(Math.PI/2); eyeG.add(mk(pc,new THREE.MeshBasicMaterial({color:INK}),0,0,0,0));
  // chest timer
  const timerMat=mat(0x2f9bff,{emissive:0x2f9bff});

  const disc=new THREE.CylinderGeometry(3.2,3.2,1.1,20); disc.rotateX(Math.PI/2); group.add(mk(disc,timerMat,0,30,6.9,0.12));
  scene.add(group);
  // shoulders / hands
  const hands=[],shoulders=[];
  [-1,1].forEach(sg=>{

    scene.add(sh); shoulders.push(sh);
    const hg2=new THREE.Group(),inner=new THREE.Group(); inner.scale.setScalar(1.25); hg2.add(inner);
    inner.add(mk(new THREE.BoxGeometry(7,6,2.4),skin,0,3,0,0.3));
    const fingers=[];
    [-2.6,-0.87,0.87,2.6].forEach((x,i)=>{
      const p=new THREE.Group(); p.position.set(x,6,0); p.rotation.z=-x*0.04; const len=[3.8,4.6,4.3,3.4][i];
      p.add(mk(new THREE.BoxGeometry(1.6,len,1.7),skin,0,len/2,0,0.22)); inner.add(p); fingers.push(p);
    });
    const tp=new THREE.Group(); tp.position.set(sg*3.4,2,0); tp.rotation.z=-sg*1.0;

function removeBoss(){
  if(!boss)return;

const PALM=3.8;
const lockDisc=new THREE.Mesh(new THREE.CircleGeometry(3.7,32),new THREE.MeshBasicMaterial({color:0xff3b2f,transparent:true,opacity:.28,depthTest:false,fog:false}));
const lockRing=new THREE.Mesh(new THREE.RingGeometry(3.4,4.0,32),new THREE.MeshBasicMaterial({color:0xff3b2f,depthTest:false,fog:false}));
lockDisc.renderOrder=900; lockRing.renderOrder=901; lockDisc.visible=lockRing.visible=false; scene.add(lockDisc); scene.add(lockRing);
function approach(v,tx,ty,tz,rate,dt){const k=1-Math.exp(-rate*dt);v.x+=(tx-v.x)*k;v.y+=(ty-v.y)*k;v.z+=(tz-v.z)*k;}
function restPos(B,h){return V3(B.group.position.x+h.side*18,B.group.position.y+22+Math.sin(B.t*1.7+h.side)*1.2,B.group.position.z+5);}

function startAttack(){
  const B=boss,ph=B.hp/B.max<0.5?2:1;
  if(Math.random()<(ph===2?0.32:0.16)){B.atk={type:'eye',t:0,fired:false};sfx.eye();}
  else{
    B.nextHand=(B.nextHand+1)%2; const hand=B.hands[B.nextHand];
    B.atk={type:'grab',hand,t:0,stage:'raise',tgt:V3()}; hand.state='atk'; showMsg('つかみ攻撃！',1.0);
  }
}
function releaseGrab(escaped){
  const h=G.grabbed; if(!h)return;
  G.grabbed=null; h.state='retract'; shakeBox.style.display='none';
  P.inv=2.0; G.shake=0.6;

  else{P.inv=0;damage(1);}
}
function updateAtk(dt){
  const B=boss,a=B.atk,ph=B.hp/B.max<0.5?2:1; a.t+=dt;
  if(a.type==='eye'){
    B.eyeGlow=Math.min(1,a.t/0.9);
    if(!a.fired&&a.t>=0.9){
      a.fired=true; B.eyeGlow=0;
      const ep=V3(B.group.position.x,B.group.position.y+51,B.group.position.z+13);
      const tp=V3(P.x,P.y,0);
      for(let i=-1;i<=1;i++){const t2=tp.clone().add(V3(i*(ph===2?7:5),0,0)); spawnEBullet(ep,t2.sub(ep),62,1.5);}
      sfx.hit();
    }
    if(a.t>=1.5){B.atk=null;B.eyeGlow=0;B.attackTimer=ph===2?1.3:2.4;}
    return;
  }
  const h=a.hand,side=h.side,p=h.g.position;
  h.curl=lerp(h.curl,0,1-Math.exp(-8*dt));
  if(a.stage==='raise'){
    approach(p,B.group.position.x+side*14,44,B.group.position.z+14,5,dt);
    if(a.t>=0.9){a.stage='track';a.t=0;}
  }else if(a.stage==='track'){
    approach(p,P.x*2.2,P.y+3-PALM,-30,3.2,dt);
    if(a.t>=(ph===2?0.65:0.9)){
      a.stage='lock';a.t=0; a.tgt.set(P.x,P.y,1);
      lockDisc.position.set(a.tgt.x,a.tgt.y,0.3); lockRing.position.copy(lockDisc.position); lockDisc.visible=lockRing.visible=true;
    }
  }else if(a.stage==='lock'){
    const dur=ph===2?0.42:0.58, k=Math.min(1,a.t/dur);
    lockRing.scale.setScalar(lerp(1.8,1,k)); lockDisc.scale.setScalar(1);
    lockDisc.material.opacity=0.18+0.18*Math.abs(Math.sin(a.t*20));
    if(a.t>=dur){a.stage='lunge';a.t=0;}
  }else if(a.stage==='lunge'){
    const sp=60+a.t*160, tx=a.tgt.x,ty=a.tgt.y-PALM,tz=a.tgt.z;
    const d=V3(tx-p.x,ty-p.y,tz-p.z), dist=d.length();
    if(dist>0.01)p.addScaledVector(d.normalize(),Math.min(dist,sp*dt));
    h.curl=lerp(h.curl,0.25,1-Math.exp(-6*dt));
    const palm=V3(p.x,p.y+PALM,p.z);
    if(palm.z>-4&&P.inv<=0&&!G.grabbed){
      const dx=palm.x-P.x,dy=palm.y-P.y;
      if(Math.hypot(dx,dy)<3.7){
        G.grabbed=h;h.state='held';h.anchor.copy(p);G.holdT=2.4;G.shakeProg=0;B.atk=null;B.attackTimer=3.2;
        lockDisc.visible=lockRing.visible=false;
        shakeBox.style.display='block'; damage(1); sfx.grab();return;
      }
    }
    if(dist<0.3){a.stage='slam';a.t=0;lockDisc.visible=lockRing.visible=false;G.shake=Math.max(G.shake,0.5);}
  }else if(a.stage==='slam'){
    h.curl=lerp(h.curl,1.3,1-Math.exp(-14*dt));
    if(a.t>=0.45){h.state='retract';B.atk=null;B.attackTimer=ph===2?0.9:2.0;}
  }
}
function updateBoss(dt){
  const B=boss; B.t+=dt;
  const G0=B.group;
  if(B.state==='intro'){
    B.z+=62*dt; B.x=0; G0.position.y=Math.abs(Math.sin(B.t*7))*1.3; G.shake=Math.max(G.shake,0.18);
    if(B.z>=-72){B.z=-72;B.state='fight';B.attackTimer=1.8;showMsg('弱点は「目」と「胸のタイマー」！',2.4);}
  }else if(B.state==='fight'){
    B.x=Math.sin(B.t*0.7)*7; G0.position.y=Math.sin(B.t*2)*0.4;
    if(!B.atk){B.attackTimer-=dt;if(B.attackTimer<=0)startAttack();}
    if(B.atk)updateAtk(dt);
  }else if(B.state==='dying'){
    B.dieT+=dt; B.dieBoom-=dt;
    G0.position.x=B.x+Math.sin(B.t*40)*0.6;
    if(B.dieBoom<=0){B.dieBoom=0.11;boom(V3(G0.position.x+rand(-12,12),rand(5,58),G0.position.z+rand(0,8)),rand(3,6));G.shake=Math.max(G.shake,0.6);}
    if(B.dieT>1.6)B.sink+=dt*9;
    G0.position.y=-B.sink;
    if(B.dieT>3.6){
      boom(V3(G0.position.x,30,G0.position.z+6),14); removeBoss(); bossbar.style.display='none';
      G.score+=5000; endGame('clear'); return;
    }
  }
  G0.position.x=B.state==='dying'?G0.position.x:B.x; G0.position.z=B.z;
  // eye tracks the jet
  B.eyeG.rotation.y=clamp((P.x-B.x)/70,-0.35,0.35); B.eyeG.rotation.x=-clamp((P.y-30)/90,-0.3,0.3);
  // weak point visuals
  const r=B.hp/B.max,blink=Math.sin(B.t*(2+(1-r)*14)*Math.PI)>0?1:0.25;
  const c=new THREE.Color(0x2f9bff).lerp(new THREE.Color(0xff2f2f),1-r);
  B.timerMat.emissive.copy(c).multiplyScalar(blink); B.timerMat.color.copy(c).lerp(new THREE.Color(0xffffff),0.25*blink);
  if(B.flash>0){B.flash-=dt;B.irisMat.emissive.setHex(0xffffff);B.timerMat.emissive.setHex(0xffffff);}
  else B.irisMat.emissive.setRGB(B.eyeGlow*0.9,B.eyeGlow*0.05,B.eyeGlow*0.05);
  // hands & arms
  B.hands.forEach((h,i)=>{
    const p=h.g.position;
    if(B.state==='dying'){p.y-=14*dt;h.curl=lerp(h.curl,0.6,0.1);}
    else if(h.state==='rest'){const rp=restPos(B,h);approach(p,rp.x,rp.y-PALM*0.2,rp.z,6,dt);h.curl=lerp(h.curl,0.7,1-Math.exp(-5*dt));}
    else if(h.state==='retract'){
      const rp=restPos(B,h);approach(p,rp.x,rp.y-PALM*0.2,rp.z,4.5,dt);h.curl=lerp(h.curl,0.7,1-Math.exp(-5*dt));
      if(p.distanceTo(V3(rp.x,rp.y-PALM*0.2,rp.z))<1.5)h.state='rest';
    }else if(h.state==='held'){
      h.curl=lerp(h.curl,1.35,1-Math.exp(-14*dt));
      p.set(h.anchor.x+rand(-.25,.25),h.anchor.y+rand(-.25,.25),h.anchor.z);
    }
    h.fingers.forEach((f,j)=>f.rotation.x=h.curl*(1+j*0.04)); h.thumb.rotation.x=h.curl*0.6;
    const sh=B.shoulders[i]; sh.position.set(G0.position.x+h.side*14,G0.position.y+37,G0.position.z);
    const a=sh.position,b=V3(p.x,p.y+1,p.z),len=a.distanceTo(b);
    h.arm.position.copy(a).add(b).multiplyScalar(0.5); h.arm.lookAt(b); h.ab.scale.z=len; h.ai.scale.z=len+0.7;
  });
}
function hitBoss(pos,dmg,kind){

function damage(n){

/* ---------- input ---------- */
function tapShake(v){ if(G.grabbed)G.shakeProg+=v; }
let ptr=null;
canvas.addEventListener('pointerdown',e=>{
  audioInit();
  ptr={id:e.pointerId,x:e.clientX,y:e.clientY};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  tapShake(0.12);
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&!ptr){
    input.tx=clamp((e.clientX/window.innerWidth)*2-1,-1,1);
    input.ty=clamp(-((e.clientY/window.innerHeight)*2-1)*1.3,-1,1);
    return;
  }
  if(!ptr||e.pointerId!==ptr.id)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y; ptr.x=e.clientX; ptr.y=e.clientY;
  input.tx=clamp(input.tx+dx/(window.innerWidth*0.38),-1,1);
  input.ty=clamp(input.ty-dy/(window.innerHeight*0.24),-1,1);
  input.shake+=(Math.abs(dx)+Math.abs(dy))/450;
});
const endPtr=e=>{if(ptr&&e.pointerId===ptr.id)ptr=null;};
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); input.keys[k]=true;
  if(!e.repeat)tapShake(0.1);
  if(k===' '||k.startsWith('arrow'))e.preventDefault();
  if(k==='enter'&&G.mode!=='play'&&G.mode!=='boss'&&G.mode!=='warn'){audioInit();startGame();}
});
window.addEventListener('keyup',e=>{input.keys[e.key.toLowerCase()]=false;});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- main update ---------- */
const camShake=V3();
function update(dt){
  G.time+=dt;
  const playable=G.mode==='play'||G.mode==='warn'||G.mode==='boss';
  // keyboard steering
  const k=input.keys,ks=2.0*dt;
  if(k['arrowleft']||k['a'])input.tx-=ks; if(k['arrowright']||k['d'])input.tx+=ks;
  if(k['arrowup']||k['w'])input.ty+=ks; if(k['arrowdown']||k['s'])input.ty-=ks;
  input.tx=clamp(input.tx,-1,1); input.ty=clamp(input.ty,-1,1);
  if(G.mode==='title'){input.tx=Math.sin(G.time*0.7)*0.7;input.ty=Math.sin(G.time*1.1)*0.4;}

  // world speed
  G.speedTarget=G.mode==='boss'?(boss&&boss.state==='intro'?60:16):(G.mode==='title'?70:90);
  G.speed=lerp(G.speed,G.speedTarget,1-Math.exp(-1.5*dt));
  groundTex.offset.y+=G.speed*dt/60;
  scenery.forEach(o=>{o.m.position.z+=G.speed*dt;if(o.m.position.z>30)placeScenery(o,-340-rand(0,40));});
  speedLines.forEach(m=>{m.position.z+=G.speed*2.2*dt;if(m.position.z>30){m.position.set(rand(-26,26),rand(1,38),-220-rand(0,30));}});

  // player
  P.inv=Math.max(0,P.inv-dt);
  if(!G.grabbed&&G.mode!=='over'){
    const k2=1-Math.exp(-14*dt); P.nx=lerp(P.nx,input.tx,k2); P.ny=lerp(P.ny,input.ty,k2);
    P.x=P.nx*6; P.y=8+P.ny*5;
    jetG.position.set(P.x,P.y,0);
    const rt=clamp(-(input.tx-P.nx)*3.2,-0.9,0.9); P.roll=lerp(P.roll,rt,1-Math.exp(-8*dt));
    jetBody.rotation.z=P.roll; jetBody.rotation.x=clamp((input.ty-P.ny)*1.4,-0.5,0.5);
    jetBody.rotation.y=lerp(jetBody.rotation.y,-P.roll*0.3,0.1);
  }else if(G.grabbed){
    const h=G.grabbed;
    jetG.position.set(h.g.position.x,h.g.position.y+PALM,h.g.position.z);
    jetBody.rotation.z=Math.sin(G.time*40)*0.5; jetBody.rotation.x=Math.cos(G.time*33)*0.3;
  }
  flameA.scale.z=1+Math.sin(G.time*50)*0.18; flameB.scale.z=1+Math.cos(G.time*60)*0.22;
  flameA.scale.x=flameA.scale.y=1+Math.sin(G.time*37)*0.08;
  if(G.mode!=='over')jetG.visible=P.inv<=0||Math.floor(G.time*20)%2===0;
  shadow.position.set(jetG.position.x,0.06,jetG.position.z); const sc=clamp(1-(jetG.position.y-3)/30,0.4,1); shadow.scale.set(3.4*sc,2.4*sc,1);

  // firing
  if(playable&&!G.grabbed){P.fireT-=dt;if(P.fireT<=0){P.fireT=0.085;firePlayer();}}
  // reticle
  const showRet=playable&&!G.grabbed;
  retFar.visible=retNear.visible=showRet;
  if(showRet){
    const ax=P.nx*18,ay=28+P.ny*24;
    retFar.position.set(ax,ay,-60); retFar.rotation.z+=dt*0.8;
    const st=V3(P.x,P.y,-1.2),to=V3(ax,ay,-60).sub(st),f=(28)/58.8; retNear.position.copy(st).addScaledVector(to,f); retNear.rotation.z-=dt*1.2;
  }

  // grab handling
  if(G.grabbed){
    G.shakeProg+=input.shake; input.shake=0; G.holdT-=dt;
    shakeFill.style.transform='scaleX('+clamp(G.shakeProg,0,1)+')';
    if(G.shakeProg>=1)releaseGrab(true); else if(G.holdT<=0)releaseGrab(false);
  }else input.shake=0;

  // stage flow
  if(G.mode==='play'){
    G.stageT+=dt;
    if(!G.stageEnd){
      G.spawnT-=dt;
      if(G.spawnT<=0){spawnWave();G.spawnT=rand(1.1,1.9)*(1-Math.min(0.4,G.stageT/100));}
      if(G.stageT>40)G.stageEnd=true;
    }else if(enemies.length===0||G.stageT>54){
      G.mode='warn';G.warnT=0;warnEl.style.display='block';
    }
  }else if(G.mode==='warn'){
    G.warnT+=dt; if(Math.floor(G.warnT*2)!==Math.floor((G.warnT-dt)*2))sfx.siren();
    if(G.warnT>2.8){
      warnEl.style.display='none';boss=buildBoss();G.mode='boss';bossbar.style.display='block';
    }
  }
  if(G.mode==='over'){G.overT-=dt;if(G.overT<=0&&screenEl.classList.contains('hide')){showScreen('over');}}

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; e.u+=dt/e.dur; const u=e.u;
    e.m.position.lerpVectors(e.s,e.tg,u); e.m.position.x+=Math.sin(u*6+e.ph)*3*(1-u*0.5);
    e.m.rotation.z=Math.cos(u*6+e.ph)*0.6;
    if(e.shoots&&!e.fired&&u>0.4&&G.mode!=='over'){e.fired=true;spawnEBullet(e.m.position,V3(P.x,P.y,0).sub(e.m.position),52,0.9);}
    if(G.mode!=='over'&&e.m.position.z>-2&&e.m.position.z<6&&P.inv<=0&&!G.grabbed){
      if(Math.hypot(e.m.position.x-P.x,e.m.position.y-P.y)<2.6){boom(e.m.position,3);scene.remove(e.m);enemies.splice(i,1);damage(1);continue;}
    }
    if(u>=1){scene.remove(e.m);enemies.splice(i,1);}
  }
  // enemy bullets
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i]; b.m.position.addScaledVector(b.v,dt); b.life-=dt; b.m.rotation.x+=dt*6;
    if(b.m.position.z>26||b.life<=0){scene.remove(b.m);eBullets.splice(i,1);continue;}
    if(G.mode!=='over'&&P.inv<=0&&!G.grabbed&&b.m.position.z>-2&&b.m.position.z<3){
      if(Math.hypot(b.m.position.x-P.x,b.m.position.y-P.y)<b.r+1.3){boom(b.m.position,2);scene.remove(b.m);eBullets.splice(i,1);damage(1);}
    }
  }
  // player bullets
  const eyeW=V3(),timW=V3();
  if(boss&&boss.state==='fight'){
    const gp=boss.group.position;
    boss.eyeG.getWorldPosition(eyeW);
    timW.set(gp.x,gp.y+30,gp.z+7);
  }
  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i],p=b.m.position; p.addScaledVector(b.v,dt);
    let dead=p.z<-170;
    if(!dead){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j]; if(p.distanceTo(e.m.position)<3.4){
          boom(e.m.position,3.2); scene.remove(e.m); enemies.splice(j,1); G.score+=100; dead=true; break;
        }
      }
    }
    if(!dead){
      for(let j=eBullets.length-1;j>=0;j--){
        const eb=eBullets[j]; if(p.distanceTo(eb.m.position)<eb.r+1.4){boom(eb.m.position,1.6);scene.remove(eb.m);eBullets.splice(j,1);G.score+=20;dead=true;break;}
      }
    }
    if(!dead&&boss&&boss.state==='fight'){
      if(p.distanceTo(eyeW)<5.4){hitBoss(p,1,'eye');dead=true;}
      else if(p.distanceTo(timW)<3.8){hitBoss(p,1,'timer');dead=true;}
      else{
        const gp=boss.group.position;
        if(Math.abs(p.x-gp.x)<13&&p.y>gp.y&&p.y<gp.y+60&&p.z<gp.z+7&&p.z>gp.z-7){boom(p,0.8,true);sfx.clank();dead=true;}
      }
    }
    if(dead){scene.remove(b.m);pBullets.splice(i,1);}
  }

  // boss
  if(boss)updateBoss(dt);
  if(boss){bossFill.style.transform='scaleX('+clamp(boss.hp/boss.max,0,1)+')';}

  updateFx(dt);

  // message timer
  if(G.msgT>0){G.msgT-=dt;if(G.msgT<=0)msgEl.classList.remove('show');}
  hudUpdate();

  // camera
  G.shake=Math.max(0,G.shake-dt*1.6);
  camShake.set(rand(-1,1)*G.shake*0.7,rand(-1,1)*G.shake*0.7,0);
  camera.position.set(jetG.position.x*0.45+camShake.x,11+(P.y-8)*0.15+camShake.y,22);
  camera.lookAt(jetG.position.x*0.25,12.5+(P.y-8)*0.3,-45);
}

/* ---------- loop ---------- */
showScreen('title');
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
