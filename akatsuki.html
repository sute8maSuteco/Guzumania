<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>あかつきの宝珠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap">
<style>
/* Layout: one column like a handheld — framed game screen, controller (D-pad left, A/B right), then a key guide. */
:root{
  --bg:#0e0c1c; --panel:#191630; --line:#332e52; --fg:#efe9da; --muted:#a19cb8; --dawn:#ffb35c; --gold:#ffd35a; --abtn:#c8402f; --bbtn:#3a3560;
  --pixel:'DotGothic16','Osaka-Mono','MS Gothic',monospace;
  --body:'M PLUS 1p','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding-inline:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:2px}
h1{font-family:var(--pixel);font-weight:400;font-size:1.8rem;margin:0;color:var(--gold);letter-spacing:.06em;text-shadow:0 0 16px rgba(255,179,92,.35)}
header p{margin:0;color:var(--muted);font-size:.85rem;text-wrap:balance}
.screen{position:relative;border-radius:14px;padding:8px;background:linear-gradient(170deg,#2b2648,#120f22);box-shadow:0 0 0 1px var(--line),0 16px 36px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:auto;aspect-ratio:480/352;max-width:100%;image-rendering:pixelated;border-radius:6px;background:#000}
#nameForm{position:absolute;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.85);border-radius:6px;font-family:var(--pixel);color:var(--fg)}
#nameForm[hidden]{display:none}
#nameForm label{font-size:1.1rem}
#nameForm input{font:inherit;font-size:1.3rem;width:9em;max-width:80%;text-align:center;background:#000;color:var(--fg);border:2px solid var(--fg);border-radius:6px;padding:6px}
#nameForm button{font-family:var(--pixel);font-size:1.1rem;padding:6px 22px;border-radius:8px;background:var(--abtn);border:none}
.pad{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px}
.dpad button{border-radius:10px;font-size:1.1rem;background:#2a2546}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
.dpad .hub{grid-column:2;grid-row:2;border-radius:10px;background:#221e3c}
.ab{display:flex;gap:14px;align-items:center}
.ab button{width:64px;height:64px;border-radius:50%;font-family:var(--pixel);font-size:1.3rem;border:none;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.ab .a{background:var(--abtn);transform:translateY(-14px)}
.ab .b{background:var(--bbtn)}
button{color:var(--fg);border:1px solid var(--line);cursor:pointer;font:inherit;touch-action:none}
button.on{filter:brightness(1.35)}
button:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.8rem}
.foot p{margin:0;min-width:0}
.foot button{border-radius:10px;padding:6px 12px;background:#2a2546}
@media (max-width:380px){.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.ab button{width:56px;height:56px}}
</style>

<div class="wrap">
  <header>
    <h1>あかつきの宝珠</h1>
    <p>黒竜ヴァルグに奪われた〈あかつきの宝珠〉を取り戻す、ひとり旅のコマンドRPG。</p>
  </header>
  <div class="screen">
    <canvas id="screen" aria-label="ゲーム画面"></canvas>
    <form id="nameForm" hidden>
      <label for="heroName">ゆうしゃの なまえ</label>
      <input id="heroName" maxlength="6" value="ユウ" autocomplete="off">
      <button type="submit">けってい</button>
    </form>
  </div>
  <div class="pad">
    <div class="dpad">
      <button class="up" data-k="up" aria-label="上">▲</button>
      <button class="left" data-k="left" aria-label="左">◀</button>
      <span class="hub"></span>
      <button class="right" data-k="right" aria-label="右">▶</button>
      <button class="down" data-k="down" aria-label="下">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-k="b" aria-label="Bボタン">B</button>
      <button class="a" data-k="a" aria-label="Aボタン">A</button>
    </div>
  </div>
  <div class="foot">
    <p>A：決定・しらべる　B：キャンセル・メニュー<br>キーボード：矢印 / Z・Enter / X・Esc</p>
    <button id="snd">音: オン</button>
  </div>
</div>

const ZONES=[['mush','bat1'],['bat1','mush2','bat2','wolf1'],['wolf1','skel1','mage1','wolf2'],['wolf2','mage2','knight1','skel2'],['knight1','skel2','knight2']];

const TOWNS={
  A:{name:'ミルナの村',inn:6,w:[1],a:[1],items:['herb'],ti:0,talk:[

for(const k in SPOTS){const[x,y]=SPOTS[k];grid[y][x]=k}

// ================= state

function tileAt(x,y){if(x<0||y<0||x>=MW||y>=MH)return'~';const t=grid[y][x];return t==='|'&&S.gateOpen?'=':t}

  if(y<=10&&x>=29)return 4;

  mage:half([".......k","......kp",".....kpp","....kppp","...kpPkk","...kPkek","...kPkkk","..kpPPkk","..kppPPP",".kpppypp",".kppppyp","kpppppyy","kppPpppy","kpPPPppp","kPPPPPPP",".kkkkkkk"]),

const sprCache=new Map();
function spr(name,pal){
  const id=name+'|'+pal;let c=sprCache.get(id);if(c)return c;
  const rows=SPR[name],P=PAL[pal],w=Math.max(...rows.map(r=>r.length));
  c=document.createElement('canvas');c.width=w;c.height=rows.length;const g=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{const col=P[ch];if(col){g.fillStyle=col;g.fillRect(x,y,1,1)}}));
  sprCache.set(id,c);return c;
}

// ================= tiles
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function mk(fn){const c=document.createElement('canvas');c.width=c.height=16;fn(c.getContext('2d'));return c}
function grass(g){R(g,0,0,16,16,'#4c9f3c');[[2,3],[9,2],[13,9],[5,11],[11,13],[1,8]].forEach(([x,y])=>{R(g,x,y,1,2,'#3a8530');R(g,x+1,y,1,1,'#6cc451')})}
function water(f){return g=>{R(g,0,0,16,16,'#2456c8');const o=f?3:0;[[1,3],[9,7],[3,12],[11,14]].forEach(([x,y])=>{R(g,(x+o)%13,y,4,1,'#5f8cf0');R(g,(x+o+1)%13,y-1,2,1,'#9fbfff')})}}
function tree(g,x,y){R(g,x+2,y,3,1,'#1d5a26');R(g,x+1,y+1,5,4,'#1d5a26');R(g,x+2,y+1,2,2,'#3a9a42');R(g,x+3,y+5,1,2,'#5b3a1e')}

function initAudio(){if(!soundOn)return;if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type='square',v=.05,delay=0,f2){
  if(!soundOn||!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.03);
}

    ui.msg.lines.push('');while(ui.msg.lines.length>4)ui.msg.lines.shift();

function closeWin(w){const i=ui.wins.indexOf(w);if(i>=0)ui.wins.splice(i,1)}

function menu(win){
  win.sel=win.sel||0;win.cols=win.cols||1;win.active=true;closeWin(win);ui.wins.push(win);
  return new Promise(res=>{
    const done=v=>{keyL=null;if(win.keep)win.active=false;else closeWin(win);res(v)};
    keyL=k=>{
      const n=win.items.length,c=win.cols;
      if(k==='up'){win.sel=c===1?(win.sel-1+n)%n:Math.max(win.sel%c,win.sel-c);sfx('cursor')}
      else if(k==='down'){win.sel=c===1?(win.sel+1)%n:(win.sel+c<n?win.sel+c:win.sel);sfx('cursor')}
      else if(k==='left'&&c>1&&win.sel%c>0){win.sel--;sfx('cursor')}
      else if(k==='right'&&c>1&&win.sel%c<c-1&&win.sel+1<n){win.sel++;sfx('cursor')}
      else if(k==='a'){sfx('ok');done(win.sel)}
      else if(k==='b'&&win.cancel!==false){sfx('cursor');done(-1)}
    };
  });
}

  sfx('enc');for(let i=0;i<3;i++){ui.flash=.9;await sleep(70);ui.flash=0;await sleep(70)}

  if(E.boss)sfx('roar');

  if(!E.boss&&Math.random()<.08){await bsay(`${E.name}は いきなり おそいかかってきた！`,400);if(await enemyAct(en))return lose()}

    if(c===0){closeWin(cmd);clearMsg();await heroAttack(en);acted=true}
    else if(c===1){
      const sp=SPELLS.filter(s=>s.battle&&S.lv>=s.lv);
      if(!sp.length){clearMsg();await bsay('まだ じゅもんを おぼえていない。',700);continue}
      const i=await menu({x:276,y:44,w:196,items:sp.map(s=>({l:s.name,r:'MP'+s.mp,dim:S.mp<s.mp}))});
      if(i<0)continue;closeWin(cmd);clearMsg();acted=await castBattle(sp[i],en);
    }else if(c===2){
      const it=itemList(false);
      if(!it.length){clearMsg();await bsay('つかえる どうぐを もっていない。',700);continue}
      const i=await menu({x:252,y:44,w:220,items:it.map(o=>({l:o.name,r:'×'+o.n}))});
      if(i<0)continue;closeWin(cmd);clearMsg();await useItem(it[i].id,true);acted=true;
    }else{
      closeWin(cmd);clearMsg();await bsay(`${S.name}は にげだした！`,320);
      if(E.boss){await bsay('しかし にげることは できない！');acted=true}
      else if(Math.random()<Math.max(.25,Math.min(.95,.55+(st().agi-en.agi)/80))){sfx('run');await sleep(250);return finish('fled')}
      else{await bsay('しかし まわりこまれてしまった！');acted=true}
    }
    if(en.hp<=0){await victory(en);return finish('win')}
    if(acted&&await enemyAct(en))return lose();
  }
}
async function heroAttack(en){
  sfx('swing');await bsay(`${S.name}の こうげき！`,220);
  if(Math.random()<1/48){await bsay('ミス！ ダメージを あたえられない！');return}
  let d;
  if(Math.random()<1/24){d=Math.floor(st().atk*(.5+Math.random()*.5));sfx('crit');ui.flash=.6;setTimeout(()=>ui.flash=0,80);await bsay('かいしんの いちげき！',260)}
  else d=dmgCalc(st().atk,en.def);
  if(d<=0){await bsay(`${en.name}は ひらりと みをかわした！`);return}
  en.hp-=d;en.blink=.4;sfx('hit');await bsay(`${en.name}に ${d}の ダメージ！`);
}
async function castBattle(sp,en){
  if(S.mp<sp.mp){await bsay('MPが たりない！',700);return false}
  S.mp-=sp.mp;sfx('spell');await bsay(`${S.name}は ${sp.name}の じゅもんを となえた！`,300);
  if(sp.type==='heal'){const n=Math.min(st().hp-S.hp,rand(sp.min,sp.max));S.hp+=n;sfx('heal');await bsay(`HPが ${n} かいふくした！`)}
  else{let d=rand(sp.min,sp.max);if(en.resist)d=Math.floor(d*en.resist);en.hp-=d;en.blink=.4;en.burn=.5;fadeBurn(en);sfx('hit');await bsay(`${en.name}に ${d}の ダメージ！`)}
  return true;
}
function fadeBurn(en){tweenTo(()=>en.burn,v=>en.burn=v,0,400)}
async function enemyAct(en){
  await sleep(120);
  const r=Math.random();
  if(en.fire&&r<en.fire.p){
    await bsay(`${en.name}は ${en.fire.name}の じゅもんを となえた！`,280);
    const d=rand(en.fire.min,en.fire.max);hurt(d);await bsay(`${S.name}は ${d}の ダメージを うけた！`);
  }else if(en.breath&&r<en.breath.p){
    await bsay(`${en.name}は ${en.breath.name}を はいた！`,300);
    let d=rand(en.breath.min,en.breath.max);if(S.a===4)d=Math.floor(d*2/3);
    ui.red=1;tweenTo(()=>ui.red,v=>ui.red=v,0,500);hurt(d);await bsay(`${S.name}は ${d}の ダメージを うけた！`);
  }else{
    await bsay(`${en.name}の こうげき！`,240);
    const d=dmgCalc(en.atk,st().def);
    if(d<=0){await bsay(`${S.name}は ひらりと みをかわした！`);return false}
    hurt(d);await bsay(`${S.name}は ${d}の ダメージを うけた！`);
  }
  return S.hp<=0;
}
async function victory(en){
  await tweenTo(()=>en.alpha,v=>en.alpha=v,0,450);
  sfx('win');await bsay(`${en.name}を たおした！`,500);
  if(en.exp){S.exp+=en.exp;await bsay(`けいけんち ${en.exp}ポイントを かくとく！`,450)}
  if(en.gold){S.gold+=en.gold;await bsay(`${en.gold}ゴールドを てにいれた！`,450)}
  while(S.lv<20&&S.exp>=EXP[S.lv+1]){
    const a=statsAt(S.lv),b=statsAt(S.lv+1);S.lv++;sfx('lvl');
    await bsay(`${S.name}の レベルが ${S.lv}に あがった！`,900);
    const diffs=[['ちから',b.str-a.str],['すばやさ',b.agi-a.agi],['さいだいHP',b.hp-a.hp],['さいだいMP',b.mp-a.mp]];
    for(const[n,v]of diffs)if(v>0)await bsay(`${n}が ${v} あがった。`,320);
    S.hp+=b.hp-a.hp;S.mp+=b.mp-a.mp;
    for(const s of SPELLS.filter(s=>s.lv===S.lv)){sfx('item');await bsay(`${s.name}の じゅもんを おぼえた！`,800)}
  }
  ui.msg.cur=true;await waitA();ui.msg.cur=false;
}
async function lose(){

async function shop(T){
  const list=[...T.w.map(i=>({k:'w',i})),...T.a.map(i=>({k:'a',i}))];
  clearMsg();await say('いらっしゃい！ なにを おもとめで？',{nowait:true});

    const o=list[i],isW=o.k==='w',d=isW?WEAP[o.i]:ARM[o.i],cur=isW?WEAP[S.w]:ARM[S.a];

// ================= loop & input
function runEvent(fn){busy=true;Promise.resolve().then(fn).catch(e=>console.error(e)).finally(()=>{busy=false;hideMsg();ui.wins.length=0;lastMove=performance.now()-400})}
const held=[];
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryStep(d){
  S.face=d;const[dx,dy]=DIRS[d],nx=S.x+dx,ny=S.y+dy,t=tileAt(nx,ny);
  if(t==='|'){runEvent(gateBump);return}
  if(!walkable(t)){const n=performance.now();if(n-lastBump>260){sfx('bump');lastBump=n}return}
  mv={dx,dy,p:0};
}
function arrive(){
  const t=tileAt(S.x,S.y);lastMove=performance.now();stepsSince++;
  if('CABEVD'.includes(t)){stepsSince=0;runEvent(()=>enterSpot(t));return}
  if(t==='s'){S.hp=Math.max(1,S.hp-2);ui.red=.8;tweenTo(()=>ui.red,v=>ui.red=v,0,250);sfx('swamp')}
  const r=RATE[t];
  if(r&&stepsSince>=4&&Math.random()<r){stepsSince=0;runEvent(randomBattle)}
}
function update(dt){
  ui.shake=Math.max(0,ui.shake-dt);
  if(B&&B.en.blink>0)B.en.blink-=dt;
  if(scene==='end')ui.endT+=dt;
  if(scene==='map'&&!busy&&!keyL){
    if(mv){mv.p+=dt/.17;if(mv.p>=1){S.x+=mv.dx;S.y+=mv.dy;mv=null;stepFrame^=1;arrive()}}
    else if(held.length)tryStep(held[held.length-1]);
  }
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render(now);requestAnimationFrame(loop)}

function press(k){
  initAudio();
  if(keyL){keyL(k);return}
  if(scene==='map'&&!busy&&!mv){
    if(k==='b')runEvent(fieldMenu);
    else if(k==='a'){const t=tileAt(S.x,S.y);if('CABEVD'.includes(t))runEvent(()=>enterSpot(t));else runEvent(fieldMenu)}
  }
}
function keyDown(k,repeat){
  if(DIRS[k]){const i=held.indexOf(k);if(i>=0)held.splice(i,1);held.push(k);if(!repeat||keyL)press(k)}
  else if(!repeat)press(k);
}
function keyUp(k){const i=held.indexOf(k);if(i>=0)held.splice(i,1)}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',Z:'a',Enter:'a',' ':'a',x:'b',X:'b',Escape:'b',Backspace:'b'};
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=KEYMAP[e.key];if(!k)return;e.preventDefault();keyDown(k,e.repeat);
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keyUp(k)});
window.addEventListener('blur',()=>{held.length=0});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('on');keyDown(k,false)});
  const up=()=>{b.classList.remove('on');keyUp(k)};
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.getElementById('snd').addEventListener('click',e=>{soundOn=!soundOn;if(soundOn)initAudio();e.currentTarget.textContent='音: '+(soundOn?'オン':'オフ')});

Object.assign(S,defaults());
window.__dbg={S,battle:id=>runEvent(()=>battle(id)),setScene:v=>{scene=v},grid,run:runEvent};
requestAnimationFrame(loop);
runEvent(titleScreen);
})();
</script>
