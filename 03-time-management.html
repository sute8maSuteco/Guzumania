<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小さなオジサンの時間管理トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #E8EEF1;
  --panel: #FFFFFF;
  --ink: #22303C;
  --sub: #5A6B78;
  --line: #C5D1D8;
  --suit: #3F5262;
  --skin: #F1CBA6;
  --hair: #C9D0D6;
  --tie: #E2AB2E;
  --marker: #F4D35E;
  --ok: #2B8A66;
  --ok-bg: #E1F3EA;
  --ng: #C2433B;
  --ng-bg: #FBE8E6;
  --ruler: #F6E7A8;
  --ruler-tick: #8B7B3A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131E27; --panel: #1C2A35; --ink: #E7EEF3; --sub: #9DB0BD; --line: #35495A;
    --suit: #6F889B; --skin: #E9BE98; --hair: #AAB5BE; --tie: #E2AB2E; --marker: #D9B93F;
    --ok: #5CC49A; --ok-bg: #173A2E; --ng: #EE7B72; --ng-bg: #40221F;
    --ruler: #5B5326; --ruler-tick: #D9C873;
  }
}
:root[data-theme="dark"] {
  --bg: #131E27; --panel: #1C2A35; --ink: #E7EEF3; --sub: #9DB0BD; --line: #35495A;
  --suit: #6F889B; --skin: #E9BE98; --hair: #AAB5BE; --tie: #E2AB2E; --marker: #D9B93F;
  --ok: #5CC49A; --ok-bg: #173A2E; --ng: #EE7B72; --ng-bg: #40221F;
  --ruler: #5B5326; --ruler-tick: #D9C873;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  font-weight: 500;
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}
#app { max-width: 540px; margin: 0 auto; padding: 16px 16px 48px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }

/* ruler progress */
.ruler-wrap { margin: 4px 0 18px; }
.ruler-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); margin-bottom: 4px; font-weight: 700; }
.ruler {
  position: relative; height: 22px; border-radius: 3px; background: var(--ruler);
  border: 1px solid var(--ruler-tick); overflow: hidden;
}
.ruler::after {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, var(--ruler-tick) 0 1px, transparent 1px 8px) bottom/100% 7px no-repeat,
    repeating-linear-gradient(90deg, var(--ruler-tick) 0 1px, transparent 1px 40px) bottom/100% 13px no-repeat;
  pointer-events: none;
}
.ruler .fill { position: absolute; inset: 0 auto 0 0; background: var(--marker); width: 0; transition: width .4s ease; opacity: .9; }

/* stage */
.stage { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
.man-col { flex: 0 0 96px; text-align: center; }
.man { width: 96px; height: auto; display: block; }
.man .suit { fill: var(--suit); }
.man .skin { fill: var(--skin); }
.man .hair { fill: var(--hair); }
.man .tie { fill: var(--tie); }
.man .shoe { fill: #1b242c; }
.man .shirt { fill: #fff; }
.man .ink { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-width: 2.4; }
.man .eye { fill: var(--ink); }
.man .brow { stroke: var(--hair); fill: none; stroke-width: 3.4; stroke-linecap: round; }
.man .shadow { fill: rgba(0,0,0,.12); }
.man .m-h, .man .m-s { display: none; }
.man.mood-happy .m-n, .man.mood-sad .m-n { display: none; }
.man.mood-happy .m-h { display: inline; }
.man.mood-sad .m-s { display: inline; }
.height-tag { font-size: 11px; color: var(--sub); margin-top: 2px; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .man.bump { animation: bump .45s ease; transform-origin: 50% 100%; }
  @keyframes bump { 0%{transform:scale(1)} 35%{transform:scale(1.06) translateY(-4px)} 100%{transform:scale(1)} }
}

.bubble {
  position: relative; flex: 1; background: var(--panel); border: 2px solid var(--ink);
  border-radius: 14px; padding: 12px 14px; font-size: 15.5px; min-height: 64px;
}
.bubble::before {
  content: ""; position: absolute; left: -11px; bottom: 22px; width: 18px; height: 18px;
  background: var(--panel); border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  transform: rotate(45deg);
}
.bubble .scene-cat { display: inline-block; font-size: 12px; font-weight: 700; background: var(--marker); color: #2b2606; border-radius: 4px; padding: 0 8px; margin-bottom: 6px; line-height: 1.7; }
.bubble p { margin: 0; }
.bubble p + p { margin-top: 8px; }
.bubble strong { font-weight: 900; }

/* choices */
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
  padding: 12px 14px; cursor: pointer; line-height: 1.65; width: 100%;
}
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice:disabled { cursor: default; }
.choice .ctext { display: block; font-size: 15px; }
.choice .chip {
  display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; border-radius: 999px;
  padding: 0 10px; line-height: 1.8;
}
.choice .why { display: block; margin-top: 6px; font-size: 14px; color: var(--sub); }
.choice.is-ok { border-color: var(--ok); background: var(--ok-bg); }
.choice.is-ok .chip { background: var(--ok); color: #fff; }
.choice.is-ng .chip { background: var(--line); color: var(--ink); }
.choice.picked-ng { border-color: var(--ng); background: var(--ng-bg); }
.choice.picked-ng .chip { background: var(--ng); color: #fff; }
.picked-mark { font-size: 12px; font-weight: 700; color: var(--sub); margin-left: 6px; }

.actions { margin-top: 18px; display: flex; justify-content: center; }
.btn {
  background: var(--ink); color: var(--bg); border: none; border-radius: 999px;
  padding: 12px 32px; font-weight: 900; font-size: 16px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }

/* start & result */
h1 { font-size: 24px; line-height: 1.4; margin: 6px 0 14px; font-weight: 900; }
.lead { color: var(--sub); font-size: 14.5px; margin: 0 0 18px; }
.note { font-size: 13px; color: var(--sub); border-top: 1px dashed var(--line); margin-top: 26px; padding-top: 12px; }
.score-box { text-align: center; margin: 4px 0 18px; }
.score-box .big { font-size: 52px; font-weight: 900; line-height: 1.1; }
.score-box .big small { font-size: 20px; color: var(--sub); }
.score-box .rank { display: inline-block; margin-top: 6px; font-size: 16px; font-weight: 900; background: var(--marker); color: #2b2606; padding: 2px 16px; border-radius: 6px; }
h2 { font-size: 17px; margin: 26px 0 10px; font-weight: 900; }
.tcard { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.tcard .th { display: flex; justify-content: space-between; gap: 10px; font-weight: 900; font-size: 15.5px; }
.tcard .cnt { color: var(--sub); font-size: 13px; white-space: nowrap; font-weight: 700; }
.tcard p { margin: 4px 0 0; font-size: 14px; color: var(--sub); }
.tcard .fix { color: var(--ink); }
details.rv { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; margin-bottom: 8px; }
details.rv summary { cursor: pointer; font-weight: 700; font-size: 14.5px; padding: 4px 0; }
details.rv .rvbody { font-size: 14px; padding: 6px 0 8px; color: var(--sub); }
details.rv .rvbody b { color: var(--ink); }
.mk-ok { color: var(--ok); font-weight: 900; }
.mk-ng { color: var(--ng); font-weight: 900; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var TAGS = {

    "ギリギリ": { name: "ぴったりの時刻で動こうとする", fix: "目標は「ちょうど」ではなく「5分前」。目標時刻を前倒しで置く。" },

  var Q = [
    { cat: "朝の準備", title: "出発までの時間",

    { cat: "遅刻しそう", title: "道を間違えた",

      tip: "遅れが分かったら、最初にやるのは連絡。",
      o: [
        { ok: 1, t: "その場で止まって「◯分遅れます。到着は◯時の見込みです」と電話かメッセージで伝え、改めて道を確認する", why: "遅れが分かった時点で連絡すれば、相手は待ち方を選べる。" },
        { tag: "連絡遅れ", t: "とにかく早く着こうとして、着いてから謝る", why: "連絡なしの遅刻は、遅れの長さ以上に印象が悪くなる。" },
        { tag: "逃避", t: "怒られそうで連絡しづらく、とりあえず歩き続ける", why: "連絡を先送りするほど、言いにくさは増える。まず1行だけ送る。" }
      ] },
    { cat: "振り返り", title: "遅刻が続いた月",
      s: "先月、遅刻を3回してしまった。今月に向けて、どうする?",
      tip: "反省よりも、仕組みの変更。",
      o: [
        { ok: 1, t: "遅れた原因を事実で書き出し(支度に時間がかかった、出発時刻が決まっていなかった、など)、出発時刻を15分前倒しにする", why: "原因が分かれば、仕組みで直せる。時刻の前倒しは、いちばん効果が出やすい。" },
        { tag: "気合い頼み", t: "「次は気をつけます」と心に決める", why: "気合いは、忙しい日ほど続かない。仕組みを変えないと、同じことが起きやすい。" },
        { tag: "自己嫌悪", t: "「自分はルーズだから」と落ち込み、考えるのをやめる", why: "落ち込んでも、遅れの原因は減らない。責める代わりに、事実を書き出す方が役に立つ。" }
      ] }
  ];

  var RANKS = [
    { min: 12, name: "時間管理マスター", say: "全問正解とは恐れ入った。あとは、実際の朝にも同じ判断ができるかどうかじゃな。" },
    { min: 10, name: "ほぼ遅刻知らず", say: "なかなかのもんじゃ。間違えた問題のコツだけ、押さえておけば十分じゃよ。" },
    { min: 7, name: "あと一歩", say: "半分以上は押さえておる。間違えたところは、誰でもやりがちな時間の使い方じゃ。仕組みで防げるから安心せい。" },
    { min: 4, name: "余白で変わるタイプ", say: "ぴったりを狙わず、「余白」と「アラーム」という仕組みに任せるのが近道じゃ。" },
    { min: 0, name: "ここから変わる", say: "気にするでない。ワシも昔は遅刻の常連じゃった。まずは下の対策を1つだけ試してみい。" }
  ];

  var app = document.getElementById("app");
  var idx = 0, answers = [], current = null;

  function manSVG(mood) {
    return '<svg class="man mood-' + mood + '" id="man" viewBox="0 0 100 152" role="img" aria-label="小さなオジサン">' +
      '<ellipse class="shadow" cx="50" cy="146" rx="30" ry="4"/>' +
      '<ellipse class="shoe" cx="39" cy="142" rx="10" ry="5"/><ellipse class="shoe" cx="61" cy="142" rx="10" ry="5"/>' +
      '<rect class="suit" x="33" y="108" width="14" height="33" rx="3"/><rect class="suit" x="53" y="108" width="14" height="33" rx="3"/>' +
      '<rect class="suit" x="17" y="72" width="11" height="36" rx="5.5"/><rect class="suit" x="72" y="72" width="11" height="36" rx="5.5"/>' +
      '<circle class="skin" cx="22.5" cy="110" r="5.5"/><circle class="skin" cx="77.5" cy="110" r="5.5"/>' +
      '<path class="suit" d="M26 76 Q26 64 38 64 L62 64 Q74 64 74 76 L74 116 Q74 120 70 120 L30 120 Q26 120 26 116 Z"/>' +
      '<polygon class="shirt" points="42,64 58,64 50,86"/>' +
      '<polygon class="tie" points="48,68 52,68 54,92 50,98 46,92"/>' +
      '<ellipse class="hair" cx="27" cy="44" rx="5" ry="9"/><ellipse class="hair" cx="73" cy="44" rx="5" ry="9"/>' +
      '<circle class="skin" cx="50" cy="40" r="24"/>' +
      '<circle class="skin" cx="26.5" cy="43" r="4"/><circle class="skin" cx="73.5" cy="43" r="4"/>' +
      '<circle class="ink" cx="42" cy="41" r="7.5" style="stroke-width:1.8"/><circle class="ink" cx="58" cy="41" r="7.5" style="stroke-width:1.8"/>' +
      '<path class="ink" d="M49.5 41 L50.5 41" style="stroke-width:1.8"/>' +
      '<circle class="eye" cx="42" cy="41" r="2"/><circle class="eye" cx="58" cy="41" r="2"/>' +
      '<g class="m-n"><path class="brow" d="M35 31 L48 31"/><path class="brow" d="M52 31 L65 31"/></g>' +
      '<g class="m-h"><path class="brow" d="M35 32 Q41 26 48 31"/><path class="brow" d="M52 31 Q59 26 65 32"/></g>' +
      '<g class="m-s"><path class="brow" d="M35 33 L48 28"/><path class="brow" d="M52 28 L65 33"/></g>' +
      '<circle cx="50" cy="48" r="3" fill="#D9A47F"/>' +
      '<path class="hair" d="M39 54 Q44 49 50 52 Q56 49 61 54 Q56 58 50 56 Q44 58 39 54 Z"/>' +
      '<path class="ink m-n" d="M45 62 L55 62"/>' +
      '<path class="ink m-h" d="M43 60 Q50 68 57 60"/>' +
      '<path class="ink m-s" d="M45 64 Q50 58 55 64"/>' +
      '</svg>';
  }

  function ruler(done, total) {
    var pct = Math.round(done / total * 100);
    return '<div class="ruler-wrap"><div class="ruler-meta"><span>' + (done < total ? '第' + (done + 1) + '問' : 'おしまい') + '</span><span>全' + total + '問</span></div>' +
      '<div class="ruler" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '"><div class="fill" style="width:' + pct + '%"></div></div></div>';
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function setMood(m) {
    var el = document.getElementById("man");
    if (!el) return;
    el.setAttribute("class", "man mood-" + m);
  }
  function bump() {
    var el = document.getElementById("man");
    if (!el) return;
    el.classList.remove("bump"); void el.getBoundingClientRect(); el.classList.add("bump");
  }

  function showStart() {
    idx = 0; answers = [];
    app.innerHTML =
      '<div class="stage"><div class="man-col">' + manSVG("normal") + '<div class="height-tag">身長 約15cm</div></div>' +
      '<div class="bubble"><p>ワシは身長15センチの小さなオジサン。時間にはうるさいぞ。</p><p>遅刻しそうなときの動き方を、いっしょに見ていこうかの。</p></div></div>' +
      '<h1>小さなオジサンの<br>時間管理トレーニング</h1>' +
      '<p class="lead">全' + Q.length + '問・3択。遅刻しそうな場面や、時間の読み違いが起きやすい場面で、あなたならどうするかを選んでください。選ぶと、選んだものの解説と、まともな判断の解説が出ます。</p>' +
      '<div class="actions"><button class="btn" id="go">はじめる</button></div>' +
      '<p class="note">これは診断ではありません。時間の読み違いは、忙しいときや疲れているときに、多くの人がやってしまいがちなものです。結果は、自分の癖に気づいて「仕組み」で対策するための目安として使ってください。</p>';
    document.getElementById("go").addEventListener("click", showQuestion);
    window.scrollTo(0, 0);
  }

  function showQuestion() {
    var q = Q[idx];
    var opts = shuffle(q.o.map(function (o, i) { return { o: o, i: i }; }));
    current = { q: q, opts: opts, done: false };
    var html = ruler(idx, Q.length) +
      '<div class="stage"><div class="man-col">' + manSVG("normal") + '</div>' +
      '<div class="bubble" id="bubble" aria-live="polite"><span class="scene-cat">' + q.cat + '・' + q.title + '</span><p>' + q.s + '</p></div></div>' +
      '<div class="choices" id="choices">';
    opts.forEach(function (x, k) {
      html += '<button class="choice" data-k="' + k + '"><span class="ctext">' + x.o.t + '</span></button>';
    });
    html += '</div><div class="actions" id="actions"></div>';
    app.innerHTML = html;
    var btns = app.querySelectorAll(".choice");
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener("click", function (e) { choose(parseInt(e.currentTarget.getAttribute("data-k"), 10)); });
    }
    window.scrollTo(0, 0);
  }

  function choose(k) {
    if (current.done) return;
    current.done = true;
    var q = current.q, picked = current.opts[k].o;
    var isOk = !!picked.ok;
    answers.push({ qi: idx, ok: isOk, tag: picked.tag || null, picked: picked.t });

    var btns = app.querySelectorAll(".choice");
    current.opts.forEach(function (x, n) {
      var el = btns[n];
      el.disabled = true;
      var chipText, cls;
      if (x.o.ok) { cls = "is-ok"; chipText = "まともな判断"; }
      else { cls = "is-ng"; chipText = "ありがちな判断:" + TAGS[x.o.tag].name; if (n === k) cls += " picked-ng"; }
      el.className = "choice " + cls;
      if (!x.o.ok && n !== k) { el.style.display = "none"; return; }
      el.innerHTML = '<span class="ctext">' + x.o.t + '</span>' +
        '<span class="chip">' + chipText + '</span>' +
        (n === k ? '<span class="picked-mark">あなたの選択</span>' : '') +
        '<span class="why">' + x.o.why + '</span>';
    });

    var bubble = document.getElementById("bubble");
    bubble.innerHTML = '<p><strong>' + (isOk ? "ほう、それが「まともな判断」じゃ。" : "それはよくある判断じゃ。責めんでええ。") + '</strong></p>' +
      '<p>コツ:' + q.tip + '</p>';
    setMood(isOk ? "happy" : "sad");
    bump();

    var last = idx === Q.length - 1;
    var act = document.getElementById("actions");
    act.innerHTML = '<button class="btn" id="next">' + (last ? "結果を見る" : "次の問題へ") + '</button>';
    var nb = document.getElementById("next");
    nb.addEventListener("click", function () {
      if (last) { showResult(); } else { idx++; showQuestion(); }
    });
    nb.focus({ preventScroll: true });
    var bar = document.querySelector(".ruler .fill");
    if (bar) bar.style.width = Math.round((idx + 1) / Q.length * 100) + "%";
    setTimeout(function () { bubble.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  }

  function showResult() {
    var score = answers.filter(function (a) { return a.ok; }).length;
    var rank = RANKS.filter(function (r) { return score >= r.min; })[0];
    var counts = {};
    answers.forEach(function (a) { if (a.tag) counts[a.tag] = (counts[a.tag] || 0) + 1; });
    var keys = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });

    var html = ruler(Q.length, Q.length) +
      '<div class="stage"><div class="man-col">' + manSVG(score >= 7 ? "happy" : "normal") + '</div>' +
      '<div class="bubble"><p>' + rank.say + '</p></div></div>' +
      '<div class="score-box"><div class="big">' + score + '<small> / ' + Q.length + '</small></div><div class="rank">' + rank.name + '</div></div>';

    html += '<h2>つい選びがちだった時間の使い方</h2>';
    if (!keys.length) {
      html += '<div class="tcard"><div class="th"><span>ありがちな時間の使い方は選ばなかった</span></div><p>全問「まともな判断」だった。実際の場面でも、この調子でいこう。</p></div>';
    } else {
      keys.slice(0, 3).forEach(function (t) {
        html += '<div class="tcard"><div class="th"><span>' + TAGS[t].name + '</span><span class="cnt">' + counts[t] + '回</span></div>' +
          '<p class="fix">対策:' + TAGS[t].fix + '</p></div>';
      });
      if (keys.length > 3) {
        html += '<p class="lead">ほかにも:' + keys.slice(3).map(function (t) { return TAGS[t].name + '(' + counts[t] + '回)'; }).join('、') + '</p>';
      }
    }

    html += '<h2>全問の振り返り</h2>';
    answers.forEach(function (a) {
      var q = Q[a.qi];
      var correct = q.o.filter(function (o) { return o.ok; })[0];
      html += '<details class="rv"><summary><span class="' + (a.ok ? 'mk-ok' : 'mk-ng') + '">' + (a.ok ? '○' : '×') + '</span> ' + q.cat + '・' + q.title + '</summary>' +
        '<div class="rvbody"><p>' + q.s + '</p>' +
        (a.ok ? '' : '<p><b>あなたの選択:</b>' + a.picked + '</p>') +
        '<p><b>まともな判断:</b>' + correct.t + '</p><p>' + correct.why + '</p></div></details>';
    });

    html += '<div class="actions"><button class="btn ghost" id="again">もう一度やる</button></div>' +
      '<p class="note">これは診断ではありません。「ありがちな判断」は誰にでも起こりうるものです。日常生活や仕事で困りごとが続く場合は、職場の相談窓口や専門機関に相談することもできます。</p>';
    app.innerHTML = html;
    document.getElementById("again").addEventListener("click", showStart);
    window.scrollTo(0, 0);
  }

  showStart();
})();
</script>
</body>
</html>
