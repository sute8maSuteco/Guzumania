<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>毒まんじゅうゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column (max 440px). Menu = pyramid hero + rules + options.
   Game = player chips, status bubble, a pyramid of three celadon trays (3/5/7), action bar. */
:root {
  --bg: #E7EDEA;
  --surface: #F6F9F7;
  --ink: #1B2928;
  --sub: #586A66;
  --line: #BFCDC7;
  --tray: #2D524E;
  --tray-edge: #1F3B38;
  --manju: #F5E8CB;
  --manju-edge: #C7AB74;
  --stamp: #C9472F;
  --mark: #F2B632;
  --mark-ink: #2A2208;
  --poison: #7B4CB8;
  --poison-edge: #4F2D82;
  --display: "Dela Gothic One", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1918; --surface: #172625; --ink: #E5EEEB; --sub: #9BB0AB; --line: #2C4340;
    --tray: #21403D; --tray-edge: #32615C; --mark: #E6AE2C; --manju-edge: #A88D5A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1918; --surface: #172625; --ink: #E5EEEB; --sub: #9BB0AB; --line: #2C4340;
  --tray: #21403D; --tray-edge: #32615C; --mark: #E6AE2C; --manju-edge: #A88D5A;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.7;
  padding-inline: 16px;
  padding-block: 20px 44px;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.wrap { max-width: 440px; margin: 0 auto; }

/* menu */
.title { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 8.4vw, 36px); line-height: 1.25; margin: 0 0 4px; text-wrap: balance; }
.lead { color: var(--sub); margin: 0 0 6px; font-size: 14px; }
.hero { margin-block: 14px 8px; --m: min(34px, calc((100vw - 96px) / 7)); }
.rules { margin: 14px 0 22px; padding: 14px 16px; border-left: 4px solid var(--poison); background: var(--surface); border-radius: 0 10px 10px 0; }
.rules h2 { font-size: 14px; letter-spacing: .08em; margin: 0 0 6px; color: var(--sub); }
.rules p { margin: 0 0 6px; font-size: 14.5px; }
.rules p:last-child { margin: 0; }
.rules strong { color: var(--poison); font-weight: 900; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rules strong { color: #B895EC; } }
:root[data-theme="dark"] .rules strong { color: #B895EC; }

fieldset.opt { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
fieldset.opt legend { font-size: 13px; font-weight: 700; color: var(--sub); letter-spacing: .06em; padding: 0; margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg label { flex: 1 1 0; min-width: 0; position: relative; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 10px 6px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 700; font-size: 15px; }
.seg input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.seg input:focus-visible + span { outline: 3px solid var(--mark); outline-offset: 2px; }
.note { font-size: 13px; color: var(--sub); margin: -4px 0 14px; }

/* buttons */
.btn { font-weight: 900; font-size: 16px; border-radius: 999px; border: 2px solid var(--ink); padding: 10px 20px; cursor: pointer; min-height: 48px; background: transparent; color: var(--ink); }
.btn.main { flex: 1; background: var(--ink); color: var(--bg); }
.btn.venom { background: var(--poison); border-color: var(--poison); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.actions { display: flex; gap: 10px; }
.btn.block { width: 100%; }
.back { display: flex; justify-content: center; margin-top: 16px; }
.back .btn { border-color: var(--line); font-size: 14px; min-height: 40px; padding-block: 6px; color: var(--sub); }

/* game */
.players { display: flex; gap: 10px; margin-bottom: 12px; }
.pl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
.pl.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--mark); }
.pl .nm { font-weight: 900; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.pl .wn { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.face { width: 38px; height: 38px; flex: none; }
.say { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 4.2em; margin-bottom: 14px; font-size: 14.5px; }
.board { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 6px 0 18px; --m: min(52px, calc((100vw - 96px) / 7)); }
.tray { display: flex; gap: 6px; padding: 10px 12px; background: var(--tray); border: 2px solid var(--tray-edge); border-radius: 18px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
.tray.vacant { background: transparent; border: 2px dashed var(--line); box-shadow: none; width: calc(var(--m) * 3); height: calc(var(--m) * .88 + 24px); padding: 0; }
.manju { display: block; width: var(--m); height: calc(var(--m) * .88); padding: 0; border: 0; background: none; cursor: pointer; transition: transform .15s ease, opacity .35s ease; -webkit-tap-highlight-color: transparent; }
.manju svg { display: block; width: 100%; height: 100%; overflow: visible; }
.manju:disabled, .manju.static { cursor: default; }
.mj-shadow { fill: rgba(0,0,0,.22); }
.mj-body { fill: var(--manju); stroke: var(--manju-edge); stroke-width: 2; }
.mj-shine { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; opacity: .8; }
.mj-stamp { fill: var(--stamp); }
.skull { display: none; }
.sk-face { fill: #F3EBFF; }
.sk-eye { fill: #3B2160; }
.sk-teeth { stroke: #3B2160; stroke-width: 1.4; fill: none; }
.manju.poison .mj-body { fill: var(--poison); stroke: var(--poison-edge); }
.manju.poison .mj-stamp, .manju.poison .mj-shine { display: none; }
.manju.poison .skull { display: inline; }
@media (hover: hover) { .manju:not(:disabled):not(.static):hover { transform: translateY(-3px); } }
.manju.sel .mj-body { stroke: var(--mark); stroke-width: 4; }
.manju.sel:not(:disabled):hover, .manju.sel { transform: translateY(-7px); }
.manju.taking:not(:disabled):hover, .manju.taking { transform: translateY(-18px) scale(.3); opacity: 0; }
@media (prefers-reduced-motion: reduce) { .manju { transition: none; } }

.result { background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 16px; text-align: center; }
.result h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.35; margin: 0 0 6px; text-wrap: balance; }
.result p { margin: 0 0 10px; color: var(--sub); font-size: 14.5px; }
.result .quote { color: var(--ink); font-weight: 700; }
.result .actions { margin-top: 12px; }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  //SOLVER-START
  var START = [3, 5, 7];
  var memo = {};
  function sum(r) { return r[0] + r[1] + r[2]; }
  // The player to move wins? Misère rule: whoever takes the last manju loses.
  function win(r) {
    var k = r.join(",");
    if (memo.hasOwnProperty(k)) return memo[k];
    var res = false;
    if (sum(r) === 0) {
      res = true;
    } else {
      for (var i = 0; i < 3 && !res; i++) {
        for (var t = 1; t <= r[i] && !res; t++) {
          var n = r.slice(); n[i] -= t;
          if (!win(n)) res = true;
        }
      }
    }
    memo[k] = res;
    return res;
  }
  function allMoves(r) {
    var out = [];
    for (var i = 0; i < 3; i++) for (var t = 1; t <= r[i]; t++) out.push({ i: i, k: t });
    return out;
  }
  function after(r, m) { var n = r.slice(); n[m.i] -= m.k; return n; }
  function bestMoves(r) { return allMoves(r).filter(function (m) { return !win(after(r, m)); }); }
  function isSuicide(r, m) { return sum(r) > 1 && sum(after(r, m)) === 0; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function safeMoves(r) {
    var all = allMoves(r);
    var safe = all.filter(function (m) { return !isSuicide(r, m); });
    return safe.length ? safe : all;
  }
  // In a lost position: take one from the biggest row to stretch the game.
  function prolong(r) {
    var safe = safeMoves(r);
    var ones = safe.filter(function (m) { return m.k === 1; });
    var pool = ones.length ? ones : safe;
    var mx = Math.max.apply(null, pool.map(function (m) { return r[m.i]; }));
    return pick(pool.filter(function (m) { return r[m.i] === mx; }));
  }
  function cpuChoose(r, level) {
    var useBest = level === "strong" || (level === "normal" && Math.random() < 0.6);
    if (useBest) {
      var best = bestMoves(r);
      return best.length ? pick(best) : prolong(r);
    }
    return pick(safeMoves(r));
  }
  //SOLVER-END

  var ROW = ["上段", "中段", "下段"];
  var app = document.getElementById("app");
  var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var S = {
    view: "menu",
    opts: { vs: "cpu", level: "strong", first: "me" },
    gid: 0, rows: START.slice(), turn: 0, starter: 0,
    sel: null, busy: false, over: false, loser: null,
    msg: "", mood: "normal", score: [0, 0]
  };

  function isCpu() { return S.opts.vs === "cpu"; }
  function names() { return isCpu() ? ["あなた", "オジサン"] : ["プレイヤー1", "プレイヤー2"]; }

  /* ---------- drawing ---------- */
  var MJ =
    '<svg viewBox="0 0 60 54" aria-hidden="true" focusable="false">' +
    '<ellipse class="mj-shadow" cx="30" cy="48" rx="25" ry="5"/>' +
    '<path class="mj-body" d="M4 44C4 20 15 6 30 6s26 14 26 38c0 4-6 6-26 6S4 48 4 44z"/>' +
    '<path class="mj-shine" d="M13 26C15 18 21 12 28 10"/>' +
    '<circle class="mj-stamp" cx="30" cy="25" r="3.2"/>' +
    '<g class="skull"><ellipse class="sk-face" cx="30" cy="27" rx="13" ry="12"/>' +
    '<rect class="sk-face" x="23" y="34" width="14" height="9" rx="2"/>' +
    '<circle class="sk-eye" cx="24.5" cy="27" r="3.6"/><circle class="sk-eye" cx="35.5" cy="27" r="3.6"/>' +
    '<path class="sk-eye" d="M30 31l-2.2 4h4.4z"/><path class="sk-teeth" d="M26.5 38v4M30 38v4M33.5 38v4"/></g>' +
    '</svg>';

  function face(mood) {
    var brows = { normal: "M14 20h9M29 20h9", think: "M14 21l9-2M29 19l9 2", happy: "M14 20q4.5-4 9 0M29 20q4.5-4 9 0", sad: "M14 19l9 2M29 21l9-2" };
    var mouth = { normal: "M23 42h6", think: "M24 42h4", happy: "M22 41q4 4 8 0", sad: "M22 44q4-3 8 0" };
    return '<svg class="face" viewBox="0 0 52 52" role="img" aria-label="小さなオジサン">' +
      '<ellipse cx="9" cy="25" rx="3.5" ry="6" fill="#C9D0D6"/><ellipse cx="43" cy="25" rx="3.5" ry="6" fill="#C9D0D6"/>' +
      '<circle cx="26" cy="28" r="17" fill="#F1CBA6"/>' +
      '<path d="M18 13q8-5 16 0" fill="none" stroke="#C9D0D6" stroke-width="2.4" stroke-linecap="round"/>' +
      '<path d="' + brows[mood] + '" fill="none" stroke="#7C858C" stroke-width="2.2" stroke-linecap="round"/>' +
      '<circle cx="19" cy="27" r="5.5" fill="rgba(255,255,255,.4)" stroke="#2A2F33" stroke-width="1.5"/>' +
      '<circle cx="33" cy="27" r="5.5" fill="rgba(255,255,255,.4)" stroke="#2A2F33" stroke-width="1.5"/>' +
      '<path d="M24.5 27h3" stroke="#2A2F33" stroke-width="1.5"/>' +
      '<circle cx="19" cy="27" r="1.5" fill="#2A2F33"/><circle cx="33" cy="27" r="1.5" fill="#2A2F33"/>' +
      '<path d="M18 36q4-3 8 0q4-3 8 0q-4 4-8 2q-4 2-8-2z" fill="#C9D0D6"/>' +
      '<path d="' + mouth[mood] + '" fill="none" stroke="#2A2F33" stroke-width="1.8" stroke-linecap="round"/>' +
      '</svg>';
  }

  function manjuBtn(o) {
    return '<button type="button" class="manju' + (o.poison ? " poison" : "") + (o.sel ? " sel" : "") + '"' +
      ' data-r="' + o.r + '" data-j="' + o.j + '"' + (o.disabled ? " disabled" : "") +
      ' aria-pressed="' + (o.sel ? "true" : "false") + '" aria-label="' + o.label + '">' + MJ + "</button>";
  }

  /* ---------- menu ---------- */
  function radio(name, val, label) {
    var id = "o-" + name + "-" + val;
    return '<label><input type="radio" id="' + id + '" name="' + name + '" value="' + val + '"' +
      (S.opts[name] === val ? " checked" : "") + "><span>" + label + "</span></label>";
  }

  function renderMenu() {
    var hero = START.map(function (n, ri) {
      var h = "";
      for (var j = 0; j < n; j++) h += '<span class="manju static' + (ri === 0 && j === 1 ? " poison" : "") + '">' + MJ + "</span>";
      return '<div class="tray">' + h + "</div>";
    }).join("");
    app.innerHTML =
      '<h1 class="title">毒まんじゅうゲーム</h1>' +
      '<p class="lead">3段・3、5、7個。最後の1個を食べたら負け。</p>' +
      '<div class="board hero" aria-hidden="true">' + hero + "</div>" +
      '<section class="rules" aria-label="ルール"><h2>ルール</h2>' +
      "<p>上段3個、中段5個、下段7個のまんじゅうが並んでいます。</p>" +
      "<p>順番に、好きな1段を選んで、その段の右側から1個以上を取ります。2つの段にまたがって取ることはできません。</p>" +
      "<p>最後に残る1個は<strong>毒まんじゅう</strong>。食べてしまった人の負けです。</p></section>" +
      '<fieldset class="opt"><legend>対戦相手</legend><div class="seg">' +
      radio("vs", "cpu", "CPUと対戦") + radio("vs", "pvp", "2人で対戦") + "</div></fieldset>" +
      '<div id="cpuopts"' + (isCpu() ? "" : " hidden") + ">" +
      '<fieldset class="opt"><legend>CPUの強さ</legend><div class="seg">' +
      radio("level", "weak", "よわい") + radio("level", "normal", "ふつう") + radio("level", "strong", "つよい") + "</div></fieldset>" +
      '<fieldset class="opt"><legend>最初に取る人</legend><div class="seg">' +
      radio("first", "me", "自分") + radio("first", "cpu", "CPU") + "</div></fieldset>" +
      '<p class="note">3・5・7個の並びは、先に取る人が必ず勝てる手を持っています。つよいCPUに勝つには、自分が先攻を選んでください。</p></div>' +
      '<div class="actions"><button type="button" class="btn main" data-act="start" id="b-start">はじめる</button></div>';
  }

  /* ---------- game ---------- */
  function turnMsg() {
    var total = sum(S.rows);
    if (isCpu()) {
      return total === 1 ? "残りは毒まんじゅう1個だけです。食べるしかありません。"
        : "あなたの番です。1つの段で、右側のまんじゅうをタップして選んでください。";
    }
    var n = names()[S.turn];
    return total === 1 ? n + "の番です。残りは毒まんじゅう1個。食べるしかありません。"
      : n + "の番です。1つの段で、右側のまんじゅうをタップして選んでください。";
  }

  function canAct() { return S.view === "game" && !S.busy && !S.over && !(isCpu() && S.turn === 1); }

  function renderGame() {
    var nm = names();
    var chips = [0, 1].map(function (i) {
      var f = (isCpu() && i === 1) ? face(S.mood) : "";
      return '<div class="pl' + (S.turn === i && !S.over ? " on" : "") + '">' + f +
        '<div><div class="nm">' + nm[i] + '</div><div class="wn">' + S.score[i] + "勝</div></div></div>";
    }).join("");

    var total = sum(S.rows);
    var dis = !canAct();
    var board = S.rows.map(function (n, ri) {
      if (n === 0) return '<div class="tray vacant" aria-hidden="true"></div>';
      var h = "";
      for (var j = 0; j < n; j++) {
        var sel = !!S.sel && S.sel.row === ri && j >= S.sel.from;
        h += manjuBtn({
          r: ri, j: j, sel: sel, disabled: dis, poison: total === 1,
          label: ROW[ri] + "の" + (j + 1) + "個目。ここから右の" + (n - j) + "個を取る"
        });
      }
      return '<div class="tray" data-row="' + ri + '" role="group" aria-label="' + ROW[ri] + "、残り" + n + '個">' + h + "</div>";
    }).join("");

    var bottom;
    if (S.over) {
      var r = resultText();
      bottom = '<div class="result" role="status"><h2>' + r.h + "</h2><p>" + r.p + "</p>" +
        (r.q ? '<p class="quote">' + r.q + "</p>" : "") +
        '<div class="actions"><button type="button" class="btn main" data-act="again" id="b-again">もう一度</button></div></div>';
    } else {
      var count = S.sel ? S.rows[S.sel.row] - S.sel.from : 0;
      var label = total === 1 ? "毒まんじゅうを食べる" : (count ? count + "個とる" : "まんじゅうを選んでください");
      bottom = '<div class="actions">' +
        (isCpu() ? '<button type="button" class="btn" data-act="hint" id="b-hint"' + (dis ? " disabled" : "") + ">ヒント</button>" : "") +
        '<button type="button" class="btn main' + (total === 1 ? " venom" : "") + '" data-act="take" id="b-take"' +
        (dis || !count ? " disabled" : "") + ">" + label + "</button></div>";
    }

    app.innerHTML =
      '<div class="players">' + chips + "</div>" +
      '<div class="say" role="status" aria-live="polite">' + S.msg + "</div>" +
      '<div class="board" role="group" aria-label="まんじゅうの盤面">' + board + "</div>" +
      bottom +
      '<div class="back"><button type="button" class="btn" data-act="menu" id="b-menu">メニューに戻る</button></div>';
  }

  function resultText() {
    var nm = names();
    if (isCpu()) {
      if (S.loser === 0) {
        return { h: "負けてしまった…", p: "毒まんじゅうを食べたのはあなたです。", q: "オジサン「ふぉっふぉっ。毒まんじゅうは君のものじゃったな」" };
      }
      return { h: "勝ちました!", p: "オジサンが毒まんじゅうを食べました。", q: "オジサン「むむ、やられたわい…」" };
    }
    var w = nm[1 - S.loser];
    return { h: w + "の勝ち!", p: nm[S.loser] + "が毒まんじゅうを食べました。", q: "" };
  }

  function render() {
    var ae = document.activeElement, key = null;
    if (ae && ae.getAttribute) {
      if (ae.getAttribute("data-r") !== null) key = '[data-r="' + ae.getAttribute("data-r") + '"][data-j="' + ae.getAttribute("data-j") + '"]';
      else if (ae.id) key = "#" + ae.id;
    }
    if (S.view === "menu") renderMenu(); else renderGame();
    if (key) {
      var el = app.querySelector(key);
      if (el && !el.disabled && el.focus) el.focus({ preventScroll: true });
    }
  }

  /* ---------- flow ---------- */
  function startGame(fresh) {
    S.gid++;
    S.view = "game";
    S.rows = START.slice(); S.sel = null; S.busy = false; S.over = false; S.loser = null; S.mood = "normal";
    if (fresh) {
      S.score = [0, 0];
      S.starter = isCpu() ? (S.opts.first === "cpu" ? 1 : 0) : 0;
    } else if (!isCpu()) {
      S.starter = 1 - S.starter;
    }
    S.turn = S.starter;
    if (isCpu() && S.turn === 1) {
      S.busy = true; S.mood = "think"; S.msg = "オジサンが考え中…";
      render(); cpuTurn();
    } else {
      S.msg = turnMsg(); render();
    }
  }

  function cpuTurn() {
    var gid = S.gid;
    setTimeout(function () {
      if (gid !== S.gid) return;
      var total = sum(S.rows);
      var m = cpuChoose(S.rows, S.opts.level);
      S.sel = { row: m.i, from: S.rows[m.i] - m.k };
      S.mood = "normal";
      S.msg = total === 1 ? "オジサン「むう…毒まんじゅうを食べるしかないのう」"
        : "オジサン「" + ROW[m.i] + "から" + m.k + "個いただくぞ」";
      render();
      setTimeout(function () { if (gid === S.gid) commit(m.i, m.k); }, reduce ? 400 : 800);
    }, reduce ? 300 : 900);
  }

  function commit(row, k) {
    var gid = S.gid;
    S.busy = true;
    var els = app.querySelectorAll('.tray[data-row="' + row + '"] .manju');
    for (var x = els.length - k; x < els.length; x++) els[x].classList.add("taking");
    setTimeout(function () {
      if (gid !== S.gid) return;
      S.rows[row] -= k; S.sel = null;
      if (sum(S.rows) === 0) { finish(S.turn); return; }
      nextTurn();
    }, reduce ? 0 : 380);
  }

  function nextTurn() {
    S.turn = 1 - S.turn; S.busy = false;
    if (isCpu() && S.turn === 1) {
      S.busy = true; S.mood = "think"; S.msg = "オジサンが考え中…";
      render(); cpuTurn(); return;
    }
    S.mood = "normal";
    if (sum(S.rows) === 1) {
      var ri = 0;
      while (S.rows[ri] === 0) ri++;
      S.sel = { row: ri, from: 0 };
    }
    S.msg = turnMsg();
    render();
  }

  function finish(loser) {
    S.over = true; S.busy = false; S.loser = loser; S.sel = null;
    S.score[1 - loser]++;
    if (isCpu()) S.mood = loser === 0 ? "happy" : "sad";
    S.msg = "勝負あり。";
    render();
  }

  function doHint() {
    if (!canAct()) return;
    var b = bestMoves(S.rows), m;
    if (b.length) {
      m = pick(b);
      S.msg = "ヒント: " + ROW[m.i] + "の右から" + m.k + "個を取ると、勝てる形になります。";
    } else {
      m = prolong(S.rows);
      S.msg = "ヒント: どの手でも不利な局面です。1個ずつ取って、相手のミスを待ちましょう。";
    }
    S.sel = { row: m.i, from: S.rows[m.i] - m.k };
    render();
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-act], .manju[data-r]") : null;
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "start") { startGame(true); return; }
    if (act === "again") { startGame(false); return; }
    if (act === "menu") { S.gid++; S.view = "menu"; S.busy = false; render(); return; }
    if (act === "hint") { doHint(); return; }
    if (act === "take") {
      if (!canAct() || !S.sel) return;
      commit(S.sel.row, S.rows[S.sel.row] - S.sel.from);
      return;
    }
    if (t.hasAttribute("data-r")) {
      if (!canAct()) return;
      var r = parseInt(t.getAttribute("data-r"), 10), j = parseInt(t.getAttribute("data-j"), 10);
      if (sum(S.rows) === 1) return;
      S.sel = (S.sel && S.sel.row === r && S.sel.from === j) ? null : { row: r, from: j };
      render();
    }
  });

  app.addEventListener("change", function (e) {
    var el = e.target;
    if (!el || el.type !== "radio") return;
    S.opts[el.name] = el.value;
    var box = document.getElementById("cpuopts");
    if (box) box.hidden = !isCpu();
  });

  render();
})();
</script>

</body></html>
