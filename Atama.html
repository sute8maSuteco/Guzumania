<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>あたま道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column. Home = today's measurement card, five practice tiles, and a 14-day score chart. Each game takes over the column with one big task area and a keypad or answer buttons below it. */
:root{
  --bg:#f4f6fb; --card:#ffffff; --fg:#1d2433; --muted:#667089; --line:#dde2ee;
  --ai:#2b4fa0; --ai-soft:#e3eaf8; --yama:#f0b429; --ok:#2f9e6a; --ng:#d6453d;
  --round:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --c-red:#e0403a; --c-blue:#2f6fe0; --c-green:#25a05a; --c-yellow:#e8b414;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141c;--card:#1a1f2b;--fg:#e8ecf4;--muted:#9aa3b8;--line:#2c3344;--ai:#8fb0ff;--ai-soft:#22304f;--yama:#f5c451;--ok:#4cc48a;--ng:#ff6b62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11141c;--card:#1a1f2b;--fg:#e8ecf4;--muted:#9aa3b8;--line:#2c3344;--ai:#8fb0ff;--ai-soft:#22304f;--yama:#f5c451;--ok:#4cc48a;--ng:#ff6b62;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding-inline:16px;line-height:1.6}
.app{max-width:480px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
h1{font-family:var(--round);font-weight:800;font-size:1.9rem;margin:0;letter-spacing:.04em;line-height:1}
h1 span{color:var(--ai)}
.date{font-size:.85rem;color:var(--muted);text-align:right}
.date b{display:block;color:var(--fg);font-family:var(--round);font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.today{display:flex;flex-direction:column;gap:12px}
.today .lab{font-size:.8rem;color:var(--muted);letter-spacing:.1em;font-weight:700}
.today h2{margin:0;font-family:var(--round);font-weight:800;font-size:1.4rem;line-height:1.35;text-wrap:balance}
.today p{margin:0;color:var(--muted);font-size:.9rem}
.big{font-family:var(--round);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1rem;color:var(--muted);margin-left:4px}
.dan{display:inline-flex;align-items:center;justify-content:center;width:78px;height:78px;border-radius:50%;border:3px solid var(--ng);color:var(--ng);font-family:var(--round);font-weight:800;font-size:1.25rem;transform:rotate(-8deg);flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{font:inherit;font-family:var(--round);font-weight:800;font-size:1.05rem;background:var(--ai);color:#fff;border:none;border-radius:999px;padding:14px 22px;cursor:pointer}
:root[data-theme="dark"] .btn{color:#11141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#11141c}}
.btn.ghost{background:none;color:var(--ai);border:2px solid var(--ai)}
.btn:focus-visible,.tile:focus-visible,.key:focus-visible,.cb:focus-visible,.cell:focus-visible{outline:3px solid var(--yama);outline-offset:2px}
.sec{font-family:var(--round);font-weight:800;font-size:1.05rem;margin:4px 0 -4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{font:inherit;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile:hover{border-color:var(--ai)}
.tile .ic{font-family:var(--round);font-weight:800;font-size:1.5rem;color:var(--ai);line-height:1}
.tile b{font-family:var(--round);font-size:1rem}
.tile span{font-size:.78rem;color:var(--muted)}
.tile .best{font-family:var(--round);font-weight:700;font-size:.8rem;color:var(--fg);font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.streak{font-size:.85rem;color:var(--muted)}
.streak b{color:var(--fg);font-family:var(--round)}
/* game */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gtop b{font-family:var(--round);font-weight:800;font-size:1.15rem}
.gtop span{font-family:var(--round);font-variant-numeric:tabular-nums;color:var(--muted)}
.quit{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;position:relative;overflow:hidden}
.q{font-family:var(--round);font-weight:800;font-size:2.8rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.ans{font-family:var(--round);font-weight:800;font-size:2.4rem;min-height:3.2rem;min-width:5ch;text-align:center;border-bottom:3px solid var(--ai);font-variant-numeric:tabular-nums}
.hint{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
.flash-ok{animation:ok .3s}.flash-ng{animation:ng .35s}
@keyframes ok{0%{background:color-mix(in srgb,var(--ok) 25%,var(--card))}100%{background:var(--card)}}
@keyframes ng{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{font:inherit;font-family:var(--round);font-weight:800;font-size:1.6rem;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px 0;cursor:pointer;touch-action:manipulation}
.key:active{background:var(--ai-soft)}
.key.wide{font-size:1rem}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{font:inherit;font-family:var(--round);font-weight:800;font-size:1.1rem;color:#fff;border:none;border-radius:14px;padding:18px 0;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.35);touch-action:manipulation}
.word{font-family:var(--round);font-weight:800;font-size:4.2rem;line-height:1}
.grid{display:grid;gap:6px;width:100%}
.cell{font:inherit;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;cursor:pointer;font-family:'Zen Kaku Gothic New',serif;font-weight:700;padding:0;touch-action:manipulation;min-width:0}
.cell.num{font-family:var(--round);font-weight:800}
.cell.done{background:var(--ai-soft);color:var(--muted)}
.digits{font-family:var(--round);font-weight:800;font-size:4.4rem;min-height:5rem;font-variant-numeric:tabular-nums}
.res{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.res h2{margin:0;font-family:var(--round);font-weight:800;font-size:1.3rem}
.res p{margin:0;color:var(--muted)}
.bars{width:100%;display:flex;flex-direction:column;gap:8px}
.bars div{display:grid;grid-template-columns:7em 1fr 2.5em;gap:8px;align-items:center;font-size:.85rem}
.bars i{display:block;height:10px;background:var(--ai-soft);border-radius:5px;overflow:hidden}
.bars i s{display:block;height:100%;background:var(--ai);text-decoration:none}
.bars b{font-family:var(--round);text-align:right;font-variant-numeric:tabular-nums}
.count{font-family:var(--round);font-weight:800;font-size:5rem;color:var(--ai)}
.note{font-size:.75rem;color:var(--muted);margin:0;text-align:center}
@media (prefers-reduced-motion:reduce){.flash-ok,.flash-ng{animation:none}}
</style>

<div class="app">
  <!-- HOME -->
  <section class="view" id="home">
    <header><h1>あたま<span>道場</span></h1><div class="date" id="date"></div></header>
    <div class="card today" id="today"></div>
    <h2 class="sec">ひとつずつ練習</h2>
    <div class="tiles" id="tiles"></div>
    <h2 class="sec">この14日間</h2>
    <div class="card chart"><div id="chart"></div><p class="streak" id="streak"></p></div>
    <p class="note">記録はこの端末のブラウザに保存されます。</p>
  </section>
  <!-- GAME -->
  <section class="view" id="game" hidden>
    <div class="gtop"><b id="gName"></b><span id="gInfo"></span><button class="quit" id="quit" type="button">やめる</button></div>
    <div class="stage" id="stage"></div>
    <div id="ctrl"></div>
  </section>
  <!-- RESULT -->
  <section class="view" id="result" hidden><div class="card res" id="resBox"></div></section>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const lin=(v,good,bad)=>Math.round(clamp(10+(bad-v)/(bad-good)*90,0,100)); // time-like: lower is better
const KANSU=['','初','二','三','四','五','六','七','八','九','十'];
function danOf(s){if(s<20)return'見習い';const d=Math.min(10,Math.floor((s-20)/8)+1);return KANSU[d]+'段'}
// ------------ storage
const KEY='atama-dojo-v1';
let DB={days:{},best:{}};
try{const s=localStorage.getItem(KEY);if(s)DB=Object.assign(DB,JSON.parse(s))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey=()=>dkey(new Date());
// ------------ games
const GAMES={
  calc:{n:'速算20問',ic:'＋−×',d:'たし算・ひき算・かけ算を20問',run:runCalc},
  stroop:{n:'色と文字',ic:'赤',d:'文字ではなく「色」を答える30秒',run:runStroop},
  memory:{n:'数字おぼえ',ic:'7 3 9',d:'流れる数字を覚えて入力',run:runMemory},
  odd:{n:'仲間はずれ',ic:'未末',d:'似た漢字の中から一つだけ違う字を探す',run:runOdd},
  order:{n:'順番タッチ',ic:'1→20',d:'1から20まで順番にタッチ',run:runOrder},
};
const DAILY=['calc','stroop','odd'];
// ------------ views
function show(v){['home','game','result'].forEach(x=>$(x).hidden=x!==v);window.scrollTo(0,0)}
let abort=null;
$('quit').addEventListener('click',()=>{if(abort)abort();renderHome();show('home')});
function renderHome(){
  const d=new Date(),w='日月火水木金土'[d.getDay()];
  $('date').innerHTML=`<b>${d.getMonth()+1}月${d.getDate()}日（${w}）</b>`;
  const t=DB.days[todayKey()];
  $('today').innerHTML=t?`<span class="lab">今日の測定</span><div class="row"><div><div class="big">${t.score}<small>点</small></div><p>${DAILY.map(k=>`${GAMES[k].n} ${t.parts[k]}`).join('　')}</p></div><span class="dan">${danOf(t.score)}</span></div><button class="btn ghost" id="again" type="button">もう一度はかる</button>`
   :`<span class="lab">今日の測定</span><h2>3種目で、今日のあたまの調子をはかる。</h2><p>速算20問・色と文字・仲間はずれ。だいたい3分です。</p><button class="btn" id="daily" type="button">測定をはじめる</button>`;
  ($('daily')||$('again')).addEventListener('click',()=>runDaily());
  $('tiles').innerHTML=Object.entries(GAMES).map(([k,g])=>`<button class="tile" data-k="${k}" type="button"><span class="ic">${g.ic}</span><b>${g.n}</b><span>${g.d}</span><span class="best">${DB.best[k]!=null?`自己ベスト ${DB.best[k]}点`:'まだ記録なし'}</span></button>`).join('');
  $('tiles').querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>runSingle(b.dataset.k)));
  renderChart();
}
function renderChart(){
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({d,k:dkey(d),v:DB.days[dkey(d)]?.score})}
  const W=320,H=150,L=28,R=8,T=10,B=24,x=i=>L+i*(W-L-R)/13,y=v=>T+(100-v)*(H-T-B)/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="14日間の得点">`;
  for(const v of [0,50,100]){s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`}
  const pts=days.map((d,i)=>d.v!=null?[x(i),y(d.v),d.v]:null);
  let path='',pen=false;pts.forEach(p=>{if(p){path+=(pen?'L':'M')+p[0]+' '+p[1];pen=true}else pen=false});
  if(path)s+=`<path d="${path}" fill="none" stroke="var(--ai)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===13?5:3.5}" fill="${i===13?'var(--yama)':'var(--ai)'}" stroke="var(--card)" stroke-width="1.5"/>`});
  days.forEach((d,i)=>{if(i%2===1||i===13)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${d.d.getDate()}</text>`});
  s+='</svg>';
  const has=pts.some(Boolean);
  $('chart').innerHTML=has?s:`<p class="streak">まだ記録がありません。今日の測定をすると、ここに得点の線が伸びていきます。</p>`;
  let st=0;for(let i=DB.days[todayKey()]?0:1;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);if(DB.days[dkey(d)])st++;else break}
  $('streak').innerHTML=has?`連続 <b>${st}</b> 日　これまでの測定 <b>${Object.keys(DB.days).length}</b> 日`:'';
}
// ------------ game shell helpers
function setGame(name,info=''){$('gName').textContent=name;$('gInfo').textContent=info}
function info(t){$('gInfo').textContent=t}
function stage(html){$('stage').innerHTML=html;return $('stage')}
function ctrl(html){$('ctrl').innerHTML=html;return $('ctrl')}
function flash(ok){const s=$('stage');s.classList.remove('flash-ok','flash-ng');void s.offsetWidth;s.classList.add(ok?'flash-ok':'flash-ng')}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function countdown(name){setGame(name);ctrl('');for(const n of [3,2,1]){stage(`<div class="count">${n}</div>`);await wait(600)}}
function keypad(onKey){
  const c=ctrl(`<div class="pad">${[7,8,9,4,5,6,1,2,3].map(n=>`<button class="key" data-k="${n}" type="button">${n}</button>`).join('')}<button class="key wide" data-k="del" type="button">けす</button><button class="key" data-k="0" type="button">0</button><button class="key wide" data-k="ok" type="button">決定</button></div>`);
  c.querySelectorAll('.key').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();onKey(b.dataset.k)}));
  const kd=e=>{if(/^[0-9]$/.test(e.key))onKey(e.key);else if(e.key==='Backspace')onKey('del');else if(e.key==='Enter')onKey('ok')};
  window.addEventListener('keydown',kd);return()=>window.removeEventListener('keydown',kd);
}
// ------------ 1. calc
function runCalc(){return new Promise(async res=>{
  await countdown(GAMES.calc.n);
  const qs=[];for(let i=0;i<20;i++){const t=i%3;if(t===0){const a=ri(11,59),b=ri(2,9);qs.push([`${a} + ${b}`,a+b])}else if(t===1){const a=ri(12,60),b=ri(2,9);qs.push([`${a} − ${b}`,a-b])}else{const a=ri(2,9),b=ri(2,9);qs.push([`${a} × ${b}`,a*b])}}
  let i=0,input='',miss=0,t0=performance.now(),done=false;
  const draw=()=>{info(`${i+1} / 20`);stage(`<div class="q">${qs[i][0]} =</div><div class="ans">${input||'&nbsp;'}</div><p class="hint">答えの桁数まで打つと自動で次へ</p>`)};
  const next=ok=>{flash(ok);if(!ok)miss++;i++;input='';if(i>=20){finish()}else draw()};
  const off=keypad(k=>{if(done)return;const ans=String(qs[i][1]);
    if(k==='del'){input=input.slice(0,-1);draw();return}
    if(k==='ok'){if(input)next(input===ans);return}
    input+=k;draw();if(input.length>=ans.length)setTimeout(()=>{if(!done&&input.length>=ans.length)next(input===ans)},120)});
  const finish=()=>{done=true;off();const sec=(performance.now()-t0)/1000;const score=clamp(lin(sec/20,1.6,7)-miss*5,0,100);res({score,detail:`${sec.toFixed(1)}秒・まちがい${miss}問`})};
  abort=()=>{done=true;off();res(null)};
  draw();
})}
// ------------ 2. stroop
function runStroop(){return new Promise(async res=>{
  await countdown(GAMES.stroop.n);
  const C=[['赤','var(--c-red)'],['青','var(--c-blue)'],['緑','var(--c-green)'],['黄','var(--c-yellow)']];
  let ok=0,ng=0,cur=null,left=30,done=false,timer;
  const nextQ=()=>{const w=ri(0,3);let c=Math.random()<.75?(w+ri(1,3))%4:w;cur=c;stage(`<div class="word" style="color:${C[c][1]}">${C[w][0]}</div><p class="hint">文字の<b>色</b>をタップ</p>`)};
  const c=ctrl(`<div class="colors">${C.map((x,i)=>`<button class="cb" data-i="${i}" type="button" style="background:${x[1]}">${x[0]}</button>`).join('')}</div>`);
  c.querySelectorAll('.cb').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(done)return;const r=+b.dataset.i===cur;r?ok++:ng++;flash(r);nextQ()}));
  const tick=()=>{left--;info(`のこり ${left}秒　正解 ${ok}`);if(left<=0)finish()};
  const finish=()=>{done=true;clearInterval(timer);const score=Math.round(clamp((ok-ng*1.5)/30*100,0,100));res({score,detail:`正解${ok}・まちがい${ng}`})};
  abort=()=>{done=true;clearInterval(timer);res(null)};
  info(`のこり 30秒　正解 0`);nextQ();timer=setInterval(tick,1000);
})}
// ------------ 3. memory
function runMemory(){return new Promise(async res=>{
  await countdown(GAMES.memory.n);
  let len=3,fails=0,best=2,done=false,off=null;
  abort=()=>{done=true;if(off)off();res(null)};
  while(!done){
    const seq=Array.from({length:len},()=>ri(0,9)).join('');
    ctrl('');info(`${len}けた`);
    for(const ch of seq){if(done)return;stage(`<div class="digits">${ch}</div><p class="hint">よく見て覚える</p>`);await wait(700);stage(`<div class="digits">&nbsp;</div><p class="hint">よく見て覚える</p>`);await wait(180)}
    if(done)return;
    let input='';const draw=()=>stage(`<div class="ans">${input||'&nbsp;'}</div><p class="hint">覚えた数字を順番に入力（${len}けた）</p>`);draw();
    const okRes=await new Promise(r=>{off=keypad(k=>{if(k==='del'){input=input.slice(0,-1);draw();return}if(k==='ok'){if(input.length)r(input===seq);return}if(input.length<len){input+=k;draw();if(input.length===len)setTimeout(()=>r(input===seq),150)}})});
    off();off=null;flash(okRes);
    if(okRes){best=len;len++;fails=0;if(len>12)break}else{stage(`<p class="hint">正解は</p><div class="digits" style="font-size:2.6rem">${seq}</div>`);await wait(1300);fails++;if(fails>=2)break}
  }
  if(done)return;
  const score=Math.round(clamp((best-2)*12.5,0,100));res({score,detail:`${best}けたまで覚えられた`});
})}
// ------------ 4. odd kanji
function runOdd(){return new Promise(async res=>{
  await countdown(GAMES.odd.n);
  const PAIRS=[['末','未'],['土','士'],['大','犬'],['王','玉'],['日','目'],['人','入'],['天','夫'],['刀','力'],['千','干'],['午','牛'],['鳥','烏'],['問','間'],['休','体'],['崇','祟'],['貝','見'],['折','析'],['陸','睦'],['微','徴']];
  const rounds=shuffle(PAIRS).slice(0,8);let r=0,pen=0,done=false;const t0=performance.now();
  abort=()=>{done=true;res(null)};ctrl('<p class="hint">一つだけ違う字をタップ</p>');
  const draw=()=>{
    const n=r<3?4:r<6?5:6,[a,b]=Math.random()<.5?rounds[r]:[rounds[r][1],rounds[r][0]],pos=ri(0,n*n-1);
    info(`${r+1} / 8`);
    const st=stage(`<div class="grid" style="grid-template-columns:repeat(${n},1fr)">${Array.from({length:n*n},(_,i)=>`<button class="cell" data-i="${i}" type="button" style="font-size:${n===4?2:n===5?1.6:1.3}rem">${i===pos?b:a}</button>`).join('')}</div>`);
    st.querySelectorAll('.cell').forEach(c=>c.addEventListener('pointerdown',e=>{e.preventDefault();if(done)return;if(+c.dataset.i===pos){flash(true);r++;if(r>=8)finish();else draw()}else{pen+=2;flash(false)}}));
  };
  const finish=()=>{done=true;const sec=(performance.now()-t0)/1000+pen;res({score:lin(sec,14,60),detail:`${sec.toFixed(1)}秒（ペナルティ${pen}秒をふくむ）`})};
  draw();
})}
// ------------ 5. order
function runOrder(){return new Promise(async res=>{
  await countdown(GAMES.order.n);
  const nums=shuffle(Array.from({length:20},(_,i)=>i+1));let next=1,pen=0,done=false;const t0=performance.now();
  abort=()=>{done=true;res(null)};ctrl('<p class="hint">1 から 20 まで順番に。まちがえると＋1秒</p>');info('つぎは 1');
  const st=stage(`<div class="grid" style="grid-template-columns:repeat(4,1fr)">${nums.map(n=>`<button class="cell num" data-n="${n}" type="button" style="font-size:1.5rem;aspect-ratio:1.25">${n}</button>`).join('')}</div>`);
  st.querySelectorAll('.cell').forEach(c=>c.addEventListener('pointerdown',e=>{e.preventDefault();if(done)return;if(+c.dataset.n===next){c.classList.add('done');next++;info(`つぎは ${next}`);if(next>20){done=true;const sec=(performance.now()-t0)/1000+pen;res({score:lin(sec,11,40),detail:`${sec.toFixed(1)}秒`})}}else{pen++;flash(false)}}));
})}
// ------------ flows
function saveBest(k,s){if(DB.best[k]==null||s>DB.best[k]){DB.best[k]=s;persist();return true}return false}
async function runSingle(k){
  show('game');const r=await GAMES[k].run();abort=null;if(!r)return;
  const nb=saveBest(k,r.score);
  show('result');$('resBox').innerHTML=`<h2>${GAMES[k].n}</h2><div class="big">${r.score}<small>点</small></div><p>${r.detail}</p>${nb?'<p style="color:var(--ng);font-weight:700">自己ベスト更新！</p>':`<p>自己ベスト ${DB.best[k]}点</p>`}<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn" id="re" type="button">もう一回</button><button class="btn ghost" id="home2" type="button">もどる</button></div>`;
  $('re').addEventListener('click',()=>runSingle(k));$('home2').addEventListener('click',()=>{renderHome();show('home')});
}
async function runDaily(){
  const parts={},details={};
  for(let i=0;i<DAILY.length;i++){
    const k=DAILY[i];show('game');
    if(i>0){setGame(`測定 ${i+1}/3`);ctrl('');stage(`<p class="hint">つぎは</p><div class="q" style="font-size:2rem">${GAMES[k].n}</div><p class="hint">${GAMES[k].d}</p>`);await wait(1600)}
    const r=await GAMES[k].run();abort=null;if(!r)return;parts[k]=r.score;details[k]=r.detail;saveBest(k,r.score);
  }
  const score=Math.round(DAILY.reduce((a,k)=>a+parts[k],0)/DAILY.length);
  const prev=DB.days[todayKey()];if(!prev||score>prev.score)DB.days[todayKey()]={score,parts};persist();
  show('result');
  $('resBox').innerHTML=`<h2>今日の測定</h2><div class="row" style="justify-content:center;gap:20px"><div class="big">${score}<small>点</small></div><span class="dan">${danOf(score)}</span></div>
   <div class="bars">${DAILY.map(k=>`<div><span>${GAMES[k].n}</span><i><s style="width:${parts[k]}%"></s></i><b>${parts[k]}</b></div>`).join('')}</div>
   <p>${DAILY.map(k=>`${GAMES[k].n}：${details[k]}`).join('<br>')}</p>${prev&&score<=prev.score?`<p>今日の記録は ${prev.score}点のまま</p>`:''}
   <button class="btn" id="home3" type="button">ホームへ</button>`;
  $('home3').addEventListener('click',()=>{renderHome();show('home')});
}
renderHome();
})();
</script>
