<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>真実に目覚めるまで</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one phone-height screen, no page scroll. Top = the room (grows to fill), with day/followers and the 目覚め meter overlaid.
   Under it a strip of the six people. Bottom = a novel-game style message box and the choices. */
:root{
  --bg:#f1eee8; --card:#ffffff; --fg:#1f2329; --muted:#6b7280; --line:#e2ddd3;
  --warm:#e8a85a; --glow:#3fa9ff; --red:#d8343a; --ok:#2f9e6a;
  --head:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1b1e24;--fg:#e9ebef;--muted:#9aa1ad;--line:#2b3038;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--card:#1b1e24;--fg:#e9ebef;--muted:#9aa1ad;--line:#2b3038;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--body);line-height:1.5}
.app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px}
.room{position:relative;flex:1 1 auto;min-height:120px;border-radius:14px;overflow:hidden;background:#000}
.room svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:#fff;font-size:.78rem;font-variant-numeric:tabular-nums}
.hud h1{margin:0;font-family:var(--head);font-weight:400;font-size:1rem;letter-spacing:.02em}
.meter{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff}
.meter .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:.72rem;gap:8px}
.meter .lab b{font-family:var(--head);font-weight:400;font-size:1.05rem}
.meter .lab span:last-child{white-space:nowrap;flex:none}
.meter .lab span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--warm),var(--glow) 60%,#7a3cff);transition:width .5s}
.people{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.p{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:center;transition:opacity .4s}
.p b{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .h{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.p .h i{display:block;height:100%;background:var(--ok);transition:width .4s}
.p.low .h i{background:var(--red)}
.p.gone{opacity:.3}
.p.gone b{text-decoration:line-through}
.msg{flex:none;height:clamp(92px,17dvh,150px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.msg .who{font-size:.7rem;color:var(--muted);letter-spacing:.05em;display:block}
.msg.big{height:clamp(120px,32dvh,270px)}
.msg .t{margin:0;font-weight:700}
.msg .old{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted);font-size:.78rem}
.msg .old p{margin:2px 0}
.msg h2{margin:0 0 4px;font-family:var(--head);font-weight:400;font-size:1.05rem;line-height:1.35}
.msg p{margin:0 0 4px}
.msg .q{font-weight:700;padding:4px 8px;border-left:3px solid var(--glow)}
.msg.bye{border-color:var(--red)}
.acts{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{font:inherit;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;min-width:0;min-height:46px;justify-content:center}
.act:hover:not(:disabled){border-color:var(--glow)}
.act:disabled{opacity:.38;cursor:not-allowed}
.act b{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act span{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.src{border-left:4px solid var(--glow)}
.act.life{border-left:4px solid var(--ok)}
.act.preach{border-left:4px solid var(--red)}
.act.ch{border-left:4px solid var(--fg)}
.act.wide{grid-column:1/-1}
.act.main{background:var(--fg);color:var(--bg);border-color:var(--fg);align-items:center}
.act.main b{font-size:.95rem}
.act:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.modal{position:fixed;inset:0;z-index:10;background:#0b0e16;color:#dfe6f2;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.sheet{width:min(100%,440px);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.sheet h2{margin:0;font-family:var(--head);font-weight:400;font-size:1.6rem;color:#fff}
.sheet p{margin:0}
.sheet .q{font-weight:700;padding:10px 12px;border-left:3px solid #7a3cff;background:#141a2a}
.sheet button{font:inherit;font-weight:700;background:#fff;color:#0b0e16;border:none;border-radius:999px;padding:12px 20px;cursor:pointer;font-size:1rem}
.note{font-size:.62rem;color:var(--muted);margin:0;text-align:center;flex:none}
@media (max-height:640px){.note{display:none}.act{min-height:40px;padding:5px 9px}.act span{display:none}}
@media (prefers-reduced-motion:reduce){.bar i,.p .h i,.p{transition:none}}
</style>

<div class="app">
  <div class="room" id="room">
    <div id="roomArt"></div>
    <div class="hud"><h1>真実に目覚めるまで</h1><span id="day"></span></div>
    <div class="meter"><div class="lab"><span id="hmNote"></span><span>目覚め度 <b id="hm">0</b></span></div><div class="bar"><i id="hmBar"></i></div></div>
  </div>
  <div class="people" id="people"></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="acts" id="acts"></div>
  <p class="note">フィクションです。登場する「説」はすべて架空で、実在の人物・団体とは関係ありません。</p>
</div>
<div class="modal" id="modal" hidden></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
// ---------- data
const PEOPLE=[
 {id:'wife',n:'妻',s:'妻',d:'結婚15年',bye:'「しばらく、実家に帰ります」',call:['今日の晩ごはん、何がいい？','たまには一緒にドラマ見ない？']},
 {id:'kid',n:'娘・ミク',s:'ミク',d:'小学4年生',bye:'「パパ、前のパパに戻ってね」',call:['パパ、日曜に動物園いこう！','宿題の算数、教えて']},
 {id:'mom',n:'母',s:'母',d:'田舎でひとり暮らし',bye:'「電話、また今度にするね」',call:['ちゃんと食べてる？','お正月は帰ってくるの？']},
 {id:'friend',n:'親友・ケンジ',s:'ケンジ',d:'高校からの付き合い',bye:'「……お前とは、もう話が通じない」',call:['今度、釣り行こうぜ','飲みに行かない？']},
 {id:'coworker',n:'同僚・サトウ',s:'サトウ',d:'隣の席',bye:'「最近、お昼は別で食べるわ」',call:['お昼、いつもの定食屋どう？','この資料、一緒に見てくれる？']},
 {id:'neighbor',n:'お隣のおばあちゃん',s:'お隣',d:'いつも挨拶してくれる',bye:'（あいさつしても、もう返事がない）',call:['煮物つくりすぎちゃって、どうぞ','いい天気ねえ']},
];
const SRC=[
 {id:'tv',n:'テレビ',need:0,gain:[2,4],tag:'テレビ',lines:[
   'ニュースでは、いつも通りの話題が流れていた。','天気予報、明日は晴れ。……本当に？','どのチャンネルも同じニュースばかり。何かを隠してる気がする。','ワイドショーで「ネットで話題」として、ある説が紹介されていた。']},
 {id:'news',n:'ニュースサイト',need:10,gain:[4,7],tag:'ニュースサイト',lines:[
   '記事より先に、コメント欄を読むようになった。','コメント欄の上位は「本当のことは報道されない」だった。','「関連記事」をたどっていたら、深夜2時になっていた。','見出しだけ読んで、全部わかった気がした。']},
 {id:'sns',n:'SNS',need:25,gain:[6,10],tag:'SNS',lines:[
   '「鳩は国の監視カメラだった」拡散 12万。いいねを押した。','同じ意見の人だけをフォローしたら、タイムラインが静かで心地いい。','「気づいてる人は気づいてる」という投稿に、強くうなずいた。','反論してきた人をブロックした。スッキリした。']},
 {id:'video',n:'動画サイト',need:40,gain:[9,14],tag:'動画サイト',lines:[
   '『9割の人が知らない、月の裏の巨大工場』再生数 300万。','おすすめ欄が、同じ話題の動画で埋まった。','「概要欄の本を読めばわかる」と言われて、3冊買った。','気づけば朝。自動再生が止まらない。']},
 {id:'board',n:'匿名掲示板',need:60,gain:[12,18],tag:'匿名掲示板',lines:[
   '「有能スレ」に、信号機の赤は気分を操る周波数だと書いてあった。','「ソースは？」「自分で調べろ」。確かに、自分で調べるべきだ。','スレの住人だけが、本当の仲間だと思えた。','「天気予報は天気を予想しているのではなく、決めている」。全部つながった。']},
];
const THEORIES=['鳩は監視カメラ説','月の裏の巨大工場説','信号機の周波数説','天気は決められている説','回転寿司のレーンは地下でつながっている説','カラスは人の言葉を全部報告している説'];
const STAGES=[[0,'ふつうの会社員。ニュースは朝のテレビで見る程度。'],[15,'「ちょっと気になる」ことが増えてきた。'],[35,'「みんな気づいていない」と思いはじめた。'],[55,'まわりの人が、何もわかっていないように見える。'],[75,'真実を知っているのは、自分と画面の向こうの仲間だけ。'],[90,'もう、誰の言葉も届かない。']];
// ---------- state
let G;
function init(){G={day:1,hm:0,followers:0,people:Object.fromEntries(PEOPLE.map(p=>[p.id,{v:ri(70,90),gone:false}])),feed:[],theories:new Set(),peak:0};}
const alive=()=>PEOPLE.filter(p=>!G.people[p.id].gone);
function addHm(n){G.hm=clamp(G.hm+n);G.peak=Math.max(G.peak,G.hm)}
function post(src,text,cls=''){G.feed.unshift({day:G.day,src,text,cls})}
// ---------- room illustration
function lerp(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function rgb(a){return`rgb(${a.join(',')})`}
function roomVB(){const el=$('room');const w=el.clientWidth||360,h=el.clientHeight||200;const H=Math.max(230,360*h/w);return `0 ${235-H} 360 ${H}`}
function roomSVG(){
  const h=G.hm/100,t=h;
  const wall=rgb(lerp([238,224,200],[22,26,40],t)),floor=rgb(lerp([196,160,120],[30,30,40],t));
  const sky=h<.5?'#9fd3f5':'#1a2240';
  let s=`<svg viewBox="${roomVB()}" preserveAspectRatio="xMidYMax slice" role="img" aria-label="部屋のようす"><rect x="-400" y="-900" width="1160" height="1300" fill="${wall}"/>`;
  s+=`<rect x="-400" y="150" width="1160" height="300" fill="${floor}"/>`;
  // window
  s+=`<rect x="250" y="30" width="80" height="62" fill="${sky}" stroke="#8a7a66" stroke-width="3"/>`;
  if(h>=.5)s+=`<rect x="250" y="30" width="80" height="62" fill="#3a2f4a"/><line x1="290" y1="30" x2="290" y2="92" stroke="#2a2238" stroke-width="2"/>`;
  else s+=`<rect x="246" y="26" width="16" height="70" fill="#c9a07a"/><rect x="318" y="26" width="16" height="70" fill="#c9a07a"/>`;
  // corkboard with red strings
  if(G.hm>=45){s+=`<rect x="20" y="22" width="110" height="74" fill="#b58a5a" stroke="#6a4a2a" stroke-width="3"/>`;
    const pts=[[34,36],[64,52],[100,34],[118,70],[48,80],[86,82]];const n=G.hm>=70?6:4;
    for(let i=0;i<n;i++){s+=`<rect x="${pts[i][0]-9}" y="${pts[i][1]-7}" width="18" height="14" fill="#f4f0e4"/>`}
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j+=2)s+=`<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="#d8343a" stroke-width="1.4"/>`;
    for(let i=0;i<n;i++)s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]-6}" r="2.4" fill="#d8343a"/>`}
  else s+=`<rect x="40" y="34" width="70" height="50" fill="#f4f0e4" stroke="#8a7a66" stroke-width="3"/><circle cx="62" cy="58" r="8" fill="#e8a85a"/><path d="M48 80 L70 62 L84 72 L104 56 L104 80 Z" fill="#7ab07a"/>`;
  // screens glow
  const glow=G.hm>=10?.25+h*.5:0;
  if(glow)s+=`<ellipse cx="180" cy="120" rx="${90+h*60}" ry="${50+h*30}" fill="rgba(63,169,255,${glow*.35})"/>`;
  // desk
  s+=`<rect x="110" y="128" width="140" height="8" fill="#6a4a2a"/><rect x="118" y="136" width="6" height="30" fill="#6a4a2a"/><rect x="236" y="136" width="6" height="30" fill="#6a4a2a"/>`;
  // TV always
  s+=`<rect x="150" y="96" width="60" height="32" rx="3" fill="#20242c"/><rect x="153" y="99" width="54" height="26" fill="${G.hm>=10?'#3fa9ff':'#8fb8d8'}"/>`;
  if(G.hm>=10)s+=`<rect x="118" y="112" width="28" height="16" rx="2" fill="#2a2e36"/><rect x="120" y="114" width="24" height="11" fill="#7fd0ff"/>`;
  if(G.hm>=40)s+=`<rect x="212" y="92" width="34" height="24" rx="2" fill="#20242c"/><rect x="214" y="94" width="30" height="19" fill="#5ab8ff"/>`;
  if(G.hm>=60)s+=`<rect x="150" y="62" width="60" height="30" rx="2" fill="#20242c"/><rect x="153" y="65" width="54" height="24" fill="#4aa0ff"/><text x="180" y="81" font-size="8" fill="#fff" text-anchor="middle" font-family="sans-serif">真実</text>`;
  if(G.hm>=80)s+=`<rect x="214" y="58" width="34" height="30" rx="2" fill="#20242c"/><rect x="216" y="60" width="30" height="26" fill="#7a3cff"/>`;
  // person
  const px=180,py=150;
  s+=`<rect x="${px-14}" y="${py-6}" width="28" height="22" rx="6" fill="#5a6070"/>`;
  s+=`<circle cx="${px}" cy="${py-16}" r="11" fill="#e8c4a0"/><path d="M${px-11} ${py-18} Q${px} ${py-32} ${px+11} ${py-18} Z" fill="#3a2a20"/>`;
  if(G.hm>=25)s+=`<rect x="${px+10}" y="${py-6}" width="7" height="11" rx="1.5" fill="#20242c"/><rect x="${px+11}" y="${py-5}" width="5" height="8" fill="#7fd0ff"/>`;
  if(G.hm>=85)s+=`<path d="M${px-13} ${py-20} L${px} ${py-42} L${px+13} ${py-20} Z" fill="#cfd4dc" stroke="#9aa1ad" stroke-width="1"/>`;
  // pizza boxes
  if(G.hm>=55)s+=`<rect x="262" y="160" width="40" height="8" fill="#d8a85a"/><rect x="266" y="152" width="36" height="8" fill="#e0b46a"/><rect x="60" y="164" width="34" height="7" fill="#d8a85a"/>`;
  // people silhouettes on the left/right edges
  const ppl=[['wife',22,150,1],['kid',44,160,.75],['mom',300,150,.95],['friend',324,152,1],['coworker',346,154,1],['neighbor',6,156,.9]];
  for(const[id,x,y,sc] of ppl){if(G.people[id].gone)continue;const op=.25+G.people[id].v/140;s+=`<g opacity="${op}" transform="translate(${x} ${y}) scale(${sc})"><circle cx="0" cy="-24" r="7" fill="#6b7280"/><rect x="-8" y="-17" width="16" height="22" rx="5" fill="#6b7280"/></g>`}
  if(G.hm>=30){const dark=clamp((G.hm-30)/70*0.55,0,.55);s+=`<rect x="-400" y="-900" width="1160" height="1400" fill="rgba(5,8,20,${dark})"/>`}
  return s+'</svg>';
}
// ---------- render
function stage(){let s=STAGES[0][1];for(const[v,t]of STAGES)if(G.hm>=v)s=t;return s}
let UI=null; // when set: {html, opts:[{l,s,cls}], cb}
function drawRoom(){$('roomArt').innerHTML=roomSVG()}
function render(){
  $('day').textContent=`${G.day}日目・フォロワー ${G.followers.toLocaleString()}`;
  drawRoom();
  $('hm').textContent=G.hm;$('hmBar').style.width=G.hm+'%';$('hmNote').textContent=stage();
  $('people').innerHTML=PEOPLE.map(p=>{const s=G.people[p.id];return`<div class="p ${s.gone?'gone':''} ${!s.gone&&s.v<30?'low':''}" title="${p.n}（${p.d}）"><b>${p.s}</b><span class="h"><i style="width:${s.gone?0:s.v}%"></i></span></div>`}).join('');
  const msg=$('msg'),acts=$('acts');
  if(UI){
    msg.className='msg'+(UI.cls?' '+UI.cls:'')+(UI.opts.length<=2?' big':'');msg.innerHTML=UI.html;
    acts.innerHTML=UI.opts.map((o,i)=>`<button class="act ${o.cls||'ch'} ${UI.opts.length%2&&i===UI.opts.length-1?'wide':''}" data-i="${i}" type="button"><b>${o.l}</b>${o.s?`<span>${o.s}</span>`:''}</button>`).join('');
    acts.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>{if(!UI)return;const cb=UI.cb;UI=null;render();cb(+b.dataset.i)}));
  }else{
    const [f,...old]=G.feed;msg.className='msg'+(f&&f.cls==='bye'?' bye':'');
    msg.innerHTML=f?`<span class="who">${f.src}・${f.day}日目</span><p class="t">${f.text}</p>${old.length?`<div class="old">${old.slice(0,8).map(o=>`<p>${o.day}日目［${o.src}］${o.text}</p>`).join('')}</div>`:''}`:'';
    const out=[];const a=alive();
    for(const s of SRC){const ok=G.hm>=s.need;out.push(`<button class="act src" data-a="src:${s.id}" type="button" ${ok?'':'disabled'}><b>${s.n}</b><span>${ok?`目覚め度 +${s.gain[0]}〜${s.gain[1]}`:`目覚め度${s.need}で解放`}</span></button>`)}
    out.push(`<button class="act preach" data-a="preach" type="button" ${a.length&&G.hm>=20?'':'disabled'}><b>真実を教える</b><span>${G.hm>=20?'相手との仲が大きく下がる':'目覚め度20で解放'}</span></button>`);
    out.push(`<button class="act life" data-a="talk" type="button" ${a.length?'':'disabled'}><b>だれかと過ごす</b><span>仲 +16・目覚め度 −5</span></button>`);
    out.push(`<button class="act life" data-a="walk" type="button"><b>散歩する</b><span>目覚め度 −8</span></button>`);
    acts.innerHTML=out.join('');
    acts.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));
  }
  msg.scrollTop=0;
}
// ---------- message-box prompts (replace the old modals)
function choose(title,body,opts,cls=''){return new Promise(res=>{UI={html:`<h2>${title}</h2>${body}`,opts,cb:res,cls};render();focusFirst()})}
function alertM(title,body,btn='つぎへ',cls=''){return choose(title,body,[{l:btn,cls:'main'}],cls).then(()=>{})}
function focusFirst(){setTimeout(()=>{const b=$('acts').querySelector('button');if(b)try{b.focus({preventScroll:true})}catch(e){}},30)}
// ---------- actions
let busy=false;
async function act(a){
  if(busy)return;busy=true;
  if(a.startsWith('src:')){
    const s=SRC.find(x=>x.id===a.slice(4));const g=ri(s.gain[0],s.gain[1]);addHm(g);
    let line=pick(s.lines);if(s.id!=='tv'&&Math.random()<.4){const th=pick(THEORIES);G.theories.add(th);line+=`（「${th}」を知った）`}
    if(s.id==='sns'||s.id==='board')G.followers+=ri(5,40)*(s.id==='board'?3:1);if(s.id==='video')G.followers+=ri(2,10);
    post(s.tag,line+`　目覚め度 +${g}`);
  }else if(a==='talk'){
    const al=alive();const i=await choose('だれと過ごす？','',al.map(p=>({l:p.n,s:`仲のよさ ${G.people[p.id].v}`})));const p=al[i];
    G.people[p.id].v=clamp(G.people[p.id].v+16);addHm(-5);post('くらし',`${p.n}と過ごした。${pick(['久しぶりに、ちゃんと目を見て話した。','画面を見ない時間は、少し退屈で、少し楽しかった。','どうでもいい話で笑った。'])}　目覚め度 −5`);
  }else if(a==='walk'){addHm(-8);post('くらし',`${pick(['公園を歩いた。鳩は、ただの鳩に見えた。','空を見上げた。雲は勝手に流れていた。','コンビニのおにぎりがおいしかった。'])}　目覚め度 −8`);}
  else if(a==='preach'){
    const al=alive();const i=await choose('だれに真実を教える？','<p>相手との仲は大きく下がります。</p>',al.map(p=>({l:p.n,s:`仲のよさ ${G.people[p.id].v}`,cls:'preach'})));const p=al[i];
    const th=G.theories.size?pick([...G.theories]):pick(THEORIES);const d=ri(22,32);G.people[p.id].v=clamp(G.people[p.id].v-d);addHm(6);G.followers+=ri(10,60);
    post('布教',`${p.n}に「${th}」を熱く語った。${pick(['相手は黙ってうなずいていた。','「……そうなんだ」とだけ言われた。','途中で、話をそらされた。'])}　仲 −${d}`);
  }
  await endDay();busy=false;
}
// ---------- day end
const EVENTS=[
 p=>({t:`${p.n}「${pick(p.call)}」`,o:[{l:'うん、いいね',s:'仲 +18・目覚め度 −3',cls:'life',f:()=>{G.people[p.id].v=clamp(G.people[p.id].v+18);addHm(-3)}},{l:'ごめん、いま大事な動画を…',s:'仲 −14・目覚め度 +5',cls:'src',f:()=>{G.people[p.id].v=clamp(G.people[p.id].v-14);addHm(5)}}]}),
 p=>({t:`${p.n}「最近、ずっとスマホ見てるね。だいじょうぶ？」`,o:[{l:'……ちょっと見すぎかもね',s:'仲 +12・目覚め度 −6',cls:'life',f:()=>{G.people[p.id].v=clamp(G.people[p.id].v+12);addHm(-6)}},{l:'お前らが何も知らないだけだ',s:'仲 −20・目覚め度 +7',cls:'preach',f:()=>{G.people[p.id].v=clamp(G.people[p.id].v-20);addHm(7)}}]}),
];
async function endDay(){
  for(const p of alive()){const s=G.people[p.id];s.v=clamp(s.v-(Math.floor(G.hm/14)+ri(0,2)));}
  render();
  const al=alive();
  if(al.length&&Math.random()<.45){const p=pick(al);const e=pick(EVENTS)(p);const i=await choose(`${G.day}日目の夜`,`<p class="q">${e.t}</p>`,e.o);e.o[i].f();post('できごと',`${e.t} → ${e.o[i].l}`)}
  for(const p of PEOPLE){const s=G.people[p.id];if(!s.gone&&s.v<=0){s.gone=true;post(p.n,p.bye,'bye');await alertM(`${p.n}が去っていった`,`<p class="q">${p.bye}</p><p>${alive().length?`まわりに残っているのは、あと${alive().length}人。`:''}</p>`,'つぎへ','bye')}}
  G.day++;render();
  if(!alive().length)return ending();
}
function ending(){
  const th=G.theories.size,m=$('modal');
  m.innerHTML=`<div class="sheet" role="dialog" aria-label="エンディング"><h2>ひとりぼっち</h2>
   <p>${G.day-1}日目の夜。部屋には、画面の光だけがある。</p>
   <p class="q">フォロワー ${G.followers.toLocaleString()}人。<br>でも、晩ごはんを一緒に食べる人は、もういない。</p>
   <p>知った「真実」：${th?[...G.theories].join('、'):'（なし）'}</p>
   <p>通知が鳴った。「新しい真実が公開されました」。<br>……あなたは、それを開いた。</p>
   <p style="font-size:.8rem;opacity:.7">※このゲームはフィクションです。不安なときこそ、画面の外の誰かと話してみてください。</p>
   <button id="again" type="button">最初からやりなおす</button></div>`;
  m.hidden=false;
  $('again').addEventListener('click',()=>{m.hidden=true;m.innerHTML='';start()});
}
// ---------- start
function start(){init();post('テレビ','朝のニュースを、なんとなく見た。いつもの一日のはじまり。');
  alertM('真実に目覚めるまで',`<p>あなたは、ごくふつうの会社員。家族と友だちに囲まれて暮らしている。</p><p>テレビ、ニュースサイト、SNS、動画サイト、匿名掲示板。情報を集めるほど「目覚め度」が上がり、新しい情報源が開く。そのかわり、まわりの人はだんだん離れていく。全員がいなくなったら、おしまい。</p>`,'はじめる')}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(G)drawRoom()},100)});
start();
})();
</script>
